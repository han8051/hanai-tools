<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%237c8cff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANAI Capture - HANAI Tools 화면 캡처</title>
<link rel="stylesheet" href="../lib/moa.css">
<style>
.body{flex:1;display:grid;grid-template-columns:62px 1fr 250px;min-height:0}
@media (max-width:900px){.body{grid-template-columns:56px 1fr}.props{display:none}}
.tools{display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.tools .tb{min-width:0;padding:6px 2px;font-size:10px}
.stage{position:relative;overflow:auto;background:repeating-conic-gradient(#8882 0% 25%,transparent 0% 50%) 0 0/20px 20px}
.stage .wrap{position:relative;margin:24px auto;width:max-content}
.stage canvas{display:block}
#cv{box-shadow:0 4px 24px rgba(0,0,0,.45)}
#ov{position:absolute;left:0;top:0;pointer-events:none}
.props{background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
.props h3{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:500}
.props section{margin-bottom:16px}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sw button{aspect-ratio:1;border-radius:6px;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--text)}
.hist{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:var(--panel);overflow-x:auto;flex:none;min-height:74px;align-items:center}
.hist .h{position:relative;flex:none}
.hist img{height:58px;max-width:110px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;background:#fff}
.hist img.cur{border-color:var(--accent)}
.hist .x{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:10px;display:none;cursor:pointer;line-height:16px;padding:0}
.hist .h:hover .x{display:block}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:100%;color:var(--dim);text-align:center;padding:24px}
.welcome .cards{display:grid;grid-template-columns:repeat(4,150px);gap:12px}
@media (max-width:760px){.welcome .cards{grid-template-columns:repeat(2,150px)}}
.welcome .card{padding:16px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;color:var(--text)}
.welcome .card:hover{border-color:var(--accent)}
.welcome .card svg{width:34px;height:34px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.welcome .card b{display:block;margin:6px 0 2px}
.welcome .card span{font-size:11px;color:var(--dim)}
/* 영역 선택 */
.region{position:fixed;inset:0;z-index:900;background:#000;cursor:crosshair;user-select:none}
.region canvas{position:absolute;left:0;top:0}
.region .help{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;z-index:2}
.region .mag{position:absolute;width:150px;pointer-events:none;background:#111;border:2px solid #fff;border-radius:8px;overflow:hidden;color:#fff;font-size:11px;font-family:Consolas,monospace;z-index:2}
.region .mag canvas{position:static;display:block;image-rendering:pixelated}
.region .mag div{padding:3px 6px;line-height:1.4}
.countdown{position:fixed;inset:0;z-index:950;display:grid;place-items:center;background:rgba(0,0,0,.35);font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none}
.textedit{position:absolute;z-index:5;background:rgba(255,255,255,.9);border:1px dashed #1e88e5;outline:none;padding:2px 4px;min-width:40px;white-space:pre;font-family:"Malgun Gothic",sans-serif;line-height:1.25;color:#000}
</style>
</head>
<body>
<div class="moa-app">
  <div class="moa-title"><div class="moa-logo">◎</div><h1>HANAI Capture</h1><span class="sub">HANAI Tools 화면 캡처</span><span class="grow"></span><span class="sub" id="imgInfo"></span></div>
  <div class="moa-toolbar" id="toolbar"></div>
  <div class="body">
    <div class="tools" id="tools"></div>
    <div class="stage" id="stage">
      <div class="welcome" id="welcome">
        <div style="font-size:18px;color:var(--text);font-weight:700">무엇을 캡처할까요?</div>
        <div class="cards">
          <div class="card" data-a="region"><svg viewBox="0 0 24 24"></svg><b>영역 지정</b><span>원하는 부분만 (Ctrl+Shift+A)</span></div>
          <div class="card" data-a="full"><svg viewBox="0 0 24 24"></svg><b>전체 화면</b><span>모니터 전체 (Ctrl+Shift+F)</span></div>
          <div class="card" data-a="window"><svg viewBox="0 0 24 24"></svg><b>창 / 탭</b><span>프로그램 창 하나 (Ctrl+Shift+W)</span></div>
          <div class="card" data-a="delay"><svg viewBox="0 0 24 24"></svg><b>지연 캡처</b><span>몇 초 뒤에 찍기 (Ctrl+Shift+D)</span></div>
        </div>
        <div style="line-height:1.8">처음 캡처할 때 브라우저가 <b>어떤 화면을 공유할지</b> 묻습니다. 고른 화면은 다음 캡처에도 그대로 쓰입니다.<br>
        윈도우의 <span class="kbd">Win</span>+<span class="kbd">Shift</span>+<span class="kbd">S</span>로 찍은 뒤 이 창에서 <span class="kbd">Ctrl</span>+<span class="kbd">V</span> 하면 바로 편집할 수 있습니다. 이미지 파일을 끌어다 놓아도 됩니다.</div>
      </div>
      <div class="wrap hidden" id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
    </div>
    <div class="props" id="props"></div>
  </div>
  <div class="hist" id="hist"></div>
  <div class="moa-status"><span class="grow" id="status">준비</span><span id="stShare"></span><span id="stPos"></span><span id="stZoom"></span></div>
</div>
<script src="../lib/pdf-lib.min.js"></script>
<script src="../lib/moa-common.js"></script>
<script src="../lib/moa-img.js"></script>
<script src="../lib/moa-online.js"></script>
<script>
(() => {
'use strict';
const {$, el, esc, toast, icon} = Moa;
Moa.applyTheme('cap');
const S = Object.assign({color:'#ff3b30', width:4, font:22, fill:false, autoCopy:true, cursor:false, fmt:'image/png', quality:.92, delay:3, keepShare:true, nameFmt:'캡처_{날짜}_{시간}', shadowOnSave:false, numStyle:'circle'}, Moa.store.get('moacap.settings', {}));
const saveS = () => Moa.store.set('moacap.settings', S);

/* 상태 */
let work = null;     // 현재 이미지 캔버스
let hist = [], fut = [];  // 실행 취소
let tool = 'arrow', zoom = 1, numCounter = 1, dirty = false;
let captures = [];   // {id, blob, url, time}
let curCap = null;
let stream = null;
const db = Moa.idb('moacapture', ['caps']);

Moa.toolbar($('#toolbar'), [
  {icon:'region', label:'영역 지정', title:'영역 지정 캡처 (Ctrl+Shift+A)', onClick:()=>capture('region')},
  {icon:'monitor', label:'전체 화면', title:'전체 화면 캡처 (Ctrl+Shift+F)', onClick:()=>capture('full')},
  {icon:'window', label:'창·탭', title:'창 또는 탭 캡처 (Ctrl+Shift+W)', onClick:()=>capture('window')},
  {icon:'clock', label:'지연 캡처', title:'몇 초 뒤 캡처 (Ctrl+Shift+D)', onClick:()=>capture('delay')},
  {icon:'refresh', label:'대상 바꾸기', title:'공유할 화면 다시 고르기', onClick:()=>{ stopShare(); capture('region'); }},
  '|',
  {icon:'open', label:'열기', title:'이미지 파일 열기 (Ctrl+O)', onClick:()=>openFile()},
  {icon:'copy', label:'붙여넣기', title:'클립보드 이미지 열기 (Ctrl+V)', onClick:()=>pasteClip()},
  '|',
  {icon:'save', label:'저장', title:'저장 (Ctrl+S)', onClick:()=>save()},
  {icon:'copy', label:'복사', title:'클립보드로 복사 (Ctrl+C)', onClick:()=>copyImg()},
  {icon:'print', label:'인쇄', title:'인쇄 (Ctrl+P)', onClick:()=>printImg()},
  {icon:'file', label:'PDF 저장', title:'PDF 파일로 저장', onClick:()=>savePdf()},
  '|',
  {icon:'undo', label:'실행 취소', title:'실행 취소 (Ctrl+Z)', onClick:()=>undo()},
  {icon:'redo', label:'다시 실행', title:'다시 실행 (Ctrl+Y)', onClick:()=>redo()},
  {icon:'zoomOut', label:'축소', onClick:()=>setZoom(zoom / 1.25)},
  {icon:'fit', label:'맞춤', onClick:()=>fit()},
  {icon:'zoomIn', label:'확대', onClick:()=>setZoom(zoom * 1.25)},
  '|',
  {icon:'text', label:'글자 추출', title:'캡처한 그림에서 글자 읽기(OCR) (Ctrl+Shift+T)', onClick:()=>ocrImage()},
  {icon:'dropper', label:'색 추출', title:'화면 어디서나 색 뽑기 (Ctrl+Shift+C)', onClick:()=>eyedrop()},
  {icon:'palette', label:'스킨', onClick:e=>Moa.themeMenu('cap', e.clientX, e.clientY+10)},
  {icon:'gear', label:'설정', onClick:()=>settings()},
  {icon:'help', label:'도움말', onClick:()=>help()},
]);
const WI = {region:'region', full:'monitor', window:'window', delay:'clock'};
document.querySelectorAll('.welcome .card').forEach(c => { c.querySelector('svg').innerHTML = Moa.icons[WI[c.dataset.a]]; c.onclick = () => capture(c.dataset.a); });

const TOOLS = [['select','이동','arrow'],['pen','펜','pen'],['hl','형광펜','highlight'],['line','직선','line'],['arrow','화살표','arrow'],['rect','사각형','rect'],['ellipse','원','ellipse'],['text','글자','text'],['number','번호','number'],['mosaic','모자이크','mosaic'],['blur','흐림','adjust'],['spot','강조','eye'],['crop','자르기','crop'],['pick','스포이트','dropper']];
TOOLS.forEach(([k, n, ic]) => { if (k === 'select') return; const b = el('button',{class:'tb', title:n, html:icon(ic) + `<span>${n}</span>`, onclick:()=>setTool(k)}); b.dataset.k = k; $('#tools').append(b); });
function setStatus(s){ $('#status').textContent = s; }

/* ================= 캡처 ================= */
async function getStream(mode){
  if (stream && stream.active && S.keepShare && mode !== 'window') return stream;
  if (stream){ stopShare(); }
  if (!navigator.mediaDevices?.getDisplayMedia){ throw new Error('이 브라우저는 화면 캡처를 지원하지 않습니다. Chrome이나 Edge 최신 버전에서 열어 주세요.'); }
  const opts = {video:{cursor: S.cursor ? 'always' : 'never'}, audio:false, selfBrowserSurface:'include', surfaceSwitching:'include', monitorTypeSurfaces:'include'};
  if (mode === 'full') opts.video.displaySurface = 'monitor';
  if (mode === 'window') opts.video.displaySurface = 'window';
  if (S.testTab) { opts.video.displaySurface = 'browser'; opts.preferCurrentTab = true; }
  try { stream = await navigator.mediaDevices.getDisplayMedia(opts); }
  catch(e){ if (e.name !== 'NotReadableError' && e.name !== 'OverconstrainedError') throw e; stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:false}); }
  stream.getVideoTracks()[0].addEventListener('ended', () => { stream = null; updateShare(); });
  updateShare();
  return stream;
}
function stopShare(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } updateShare(); }
function updateShare(){
  const t = stream?.getVideoTracks()[0];
  $('#stShare').innerHTML = t ? `● 공유 중: ${esc(t.label || '화면')} <a href="#" id="stopShare" style="color:var(--accent)">중지</a>` : '';
  const a = $('#stopShare'); if (a) a.onclick = e => { e.preventDefault(); stopShare(); };
}
async function grabFrame(s){
  const v = el('video',{muted:true, playsInline:true}); v.srcObject = s;
  await v.play();
  if (!v.videoWidth) await new Promise(r => v.addEventListener('loadeddata', r, {once:true}));
  await new Promise(r => setTimeout(r, 180));
  if ('requestVideoFrameCallback' in v) await new Promise(r => { v.requestVideoFrameCallback(() => r()); setTimeout(r, 300); });
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0); v.pause(); v.srcObject = null;
  return c;
}
async function capture(mode){
  let s;
  try { s = await getStream(mode === 'delay' ? 'any' : mode); }
  catch(e){ if (e.name === 'NotAllowedError') setStatus('캡처를 취소했습니다'); else Moa.alert(e.message || String(e), '캡처할 수 없습니다'); return; }
  let delay = 0;
  if (mode === 'delay'){
    const r = await Moa.modal({title:'지연 캡처', body:el('div',null, '캡처할 화면을 준비하세요. 시간이 지나면 자동으로 찍습니다.', el('div',{class:'row', style:{marginTop:'10px'}}, ...[3,5,10].map(n => el('button',{class:'btn' + (S.delay === n ? ' primary' : ''), onclick:()=>{ S.delay = n; saveS(); Moa._lastModal.close(); }}, n + '초')))), buttons:[{label:'취소', value:null}, {label:'시작', primary:true, value:true}]});
    if (r === null && !document.querySelector('.moa-modal-bg') && !S._delayGo) { /* 닫기 버튼 */ }
    delay = S.delay;
    const cd = el('div',{class:'countdown'}); document.body.append(cd);
    for (let i = delay; i > 0; i--){ cd.textContent = i; document.title = `(${i}) HANAI Capture`; await new Promise(r => setTimeout(r, 1000)); }
    cd.remove(); document.title = 'HANAI Capture - HANAI Tools 화면 캡처';
    await new Promise(r => setTimeout(r, 120));
  } else await new Promise(r => setTimeout(r, 250));
  let frame;
  try { frame = await grabFrame(s); } catch(e){ Moa.alert('화면을 가져오지 못했습니다: ' + e.message); return; }
  if (!S.keepShare) stopShare();
  if (mode === 'region' || (mode === 'delay' && S.delayRegion)){ const c = await selectRegion(frame); if (!c) { setStatus('영역 선택을 취소했습니다'); return; } frame = c; }
  await loadCanvas(frame, true);
}
/* 영역 선택 오버레이 */
function selectRegion(src){
  return new Promise(resolve => {
    const root = el('div',{class:'region'});
    const base = el('canvas'), ov = el('canvas'), help = el('div',{class:'help'}, '끌어서 캡처할 영역을 고르세요 · Enter: 전체 · Esc: 취소 · 방향키: 1px 조절');
    const mag = el('div',{class:'mag'}); const mc = el('canvas',{width:144, height:96}); const mi = el('div'); mag.append(mc, mi);
    root.append(base, ov, help, mag); document.body.append(root);
    const W = innerWidth, H = innerHeight; const k = Math.min(W / src.width, H / src.height);
    const dw = src.width * k, dh = src.height * k, ox = (W - dw) / 2, oy = (H - dh) / 2;
    base.width = W; base.height = H; ov.width = W; ov.height = H;
    const bg = base.getContext('2d'); bg.imageSmoothingQuality = 'high'; bg.drawImage(src, ox, oy, dw, dh);
    const sctx = src.getContext('2d');
    let a = null, b = null, rect = null, mouse = [W/2, H/2];
    const toSrc = (x, y) => [Math.max(0, Math.min(src.width, (x - ox) / k)), Math.max(0, Math.min(src.height, (y - oy) / k))];
    const draw = () => {
      const g = ov.getContext('2d'); g.clearRect(0, 0, W, H); g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, W, H);
      if (rect){ const [x1, y1] = [ox + rect.x * k, oy + rect.y * k]; g.clearRect(x1, y1, rect.w * k, rect.h * k); g.strokeStyle = '#3fc1c9'; g.lineWidth = 2; g.strokeRect(x1 - 1, y1 - 1, rect.w * k + 2, rect.h * k + 2);
        const lbl = `${Math.round(rect.w)} × ${Math.round(rect.h)}`; g.font = '12px Consolas,monospace'; const tw = g.measureText(lbl).width + 12; const ly = y1 > 24 ? y1 - 22 : y1 + 4; g.fillStyle = '#3fc1c9'; g.fillRect(x1, ly, tw, 18); g.fillStyle = '#08121a'; g.fillText(lbl, x1 + 6, ly + 13); }
      // 십자선
      g.strokeStyle = 'rgba(63,193,201,.6)'; g.lineWidth = 1; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(mouse[0], 0); g.lineTo(mouse[0], H); g.moveTo(0, mouse[1]); g.lineTo(W, mouse[1]); g.stroke(); g.setLineDash([]);
      // 돋보기
      const [sx, sy] = toSrc(...mouse); const mg = mc.getContext('2d'); mg.imageSmoothingEnabled = false; mg.fillStyle = '#000'; mg.fillRect(0, 0, 144, 96);
      mg.drawImage(src, sx - 12, sy - 8, 24, 16, 0, 0, 144, 96); mg.strokeStyle = '#ff3b30'; mg.strokeRect(69, 45, 6, 6);
      const px = sctx.getImageData(Math.min(src.width - 1, Math.floor(sx)), Math.min(src.height - 1, Math.floor(sy)), 1, 1).data;
      const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
      mi.innerHTML = `${Math.floor(sx)}, ${Math.floor(sy)}<br><span style="display:inline-block;width:10px;height:10px;background:${hex};border:1px solid #fff;vertical-align:middle"></span> ${hex}`;
      let mx = mouse[0] + 20, my = mouse[1] + 20; if (mx + 154 > W) mx = mouse[0] - 170; if (my + 140 > H) my = mouse[1] - 150; mag.style.left = mx + 'px'; mag.style.top = my + 'px';
    };
    const norm = () => { if (!a || !b) return null; const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]); return {x, y, w:Math.abs(a[0] - b[0]), h:Math.abs(a[1] - b[1])}; };
    root.onmousedown = e => { a = toSrc(e.clientX, e.clientY); b = a; rect = norm(); draw(); };
    root.onmousemove = e => { mouse = [e.clientX, e.clientY]; if (a && e.buttons & 1){ b = toSrc(e.clientX, e.clientY); rect = norm(); } draw(); };
    root.onmouseup = () => { if (rect && rect.w > 3 && rect.h > 3) finish(); };
    root.ondblclick = () => { rect = {x:0, y:0, w:src.width, h:src.height}; finish(); };
    const key = e => {
      if (e.key === 'Escape'){ e.preventDefault(); done(null); }
      else if (e.key === 'Enter'){ e.preventDefault(); if (!rect || rect.w < 3) rect = {x:0, y:0, w:src.width, h:src.height}; finish(); }
      else if (rect && e.key.startsWith('Arrow')){ e.preventDefault(); const d = e.shiftKey ? 10 : 1; if (e.ctrlKey){ if (e.key === 'ArrowRight') rect.w += d; if (e.key === 'ArrowLeft') rect.w -= d; if (e.key === 'ArrowDown') rect.h += d; if (e.key === 'ArrowUp') rect.h -= d; } else { if (e.key === 'ArrowRight') rect.x += d; if (e.key === 'ArrowLeft') rect.x -= d; if (e.key === 'ArrowDown') rect.y += d; if (e.key === 'ArrowUp') rect.y -= d; } draw(); }
    };
    document.addEventListener('keydown', key, true);
    function finish(){ const r = rect; const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(r.w)); c.height = Math.max(1, Math.round(r.h)); c.getContext('2d').drawImage(src, -Math.round(r.x), -Math.round(r.y)); done(c); }
    function done(v){ document.removeEventListener('keydown', key, true); root.remove(); resolve(v); }
    draw();
  });
}

/* ================= 이미지 불러오기 ================= */
async function loadCanvas(c, isCapture){
  if (dirty && work && !(await Moa.confirm('편집 중인 그림이 바뀝니다. 계속할까요? (현재 그림은 아래 기록에 남아 있습니다)'))) return;
  work = MoaImg.cloneCanvas(c); hist = []; fut = []; numCounter = 1; dirty = false;
  $('#welcome').classList.add('hidden'); $('#wrap').classList.remove('hidden');
  fit();
  if (isCapture){
    const blob = await Moa.canvasToBlob(work, 'image/png');
    const cap = {id: Date.now(), blob, time: Date.now()}; captures.unshift(cap); curCap = cap;
    try { await db.set('caps', cap.id, {id:cap.id, blob, time:cap.time}); const keys = (await db.keys('caps')).sort((a, b) => b - a); for (const k of keys.slice(40)) await db.del('caps', k); } catch(e){}
    renderHist();
    if (S.autoCopy) copyImg(true);
    setStatus(`캡처했습니다 (${work.width} × ${work.height})` + (S.autoCopy ? ' · 클립보드에 복사됨' : ''));
  }
  setTool(tool);
}
async function openFile(){ const [f] = await Moa.pickFiles({accept:'image/*', multiple:false}); if (f) openBlob(f); }
async function openBlob(b){ const img = await Moa.loadImage(URL.createObjectURL(b)).catch(() => null); if (!img) return toast('열 수 없는 그림입니다'); const c = MoaImg.canvasFrom(img); URL.revokeObjectURL(img.src); await loadCanvas(c, true); }
async function pasteClip(){

}
document.addEventListener('paste', e => { if (e.target.matches('input,textarea,.textedit')) return; const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/')); if (f){ e.preventDefault(); openBlob(f); } });

async function loadHistory(){ try { const all = await db.all('caps'); captures = all.sort((a, b) => b.time - a.time); renderHist(); } catch(e){} }
function renderHist(){
  const h = $('#hist'); h.innerHTML = '';
  if (!captures.length){ h.append(el('span',{class:'dim', style:{fontSize:'12px'}}, '캡처 기록이 여기에 쌓입니다 (최근 40개, 이 브라우저에만 저장)')); return; }
  h.append(el('span',{class:'dim', style:{fontSize:'11px', writingMode:'vertical-rl'}}, '기록'));
  captures.forEach(c => {
    if (!c.url) c.url = URL.createObjectURL(c.blob);
    const im = el('img',{src:c.url, class: c === curCap ? 'cur' : '', title: new Date(c.time).toLocaleString('ko-KR') + ' · 클릭: 열기'});
    im.onclick = async () => { if (dirty && !(await Moa.confirm('편집 중인 내용을 버리고 이 기록을 열까요?'))) return; dirty = false; curCap = c; const img = await Moa.loadImage(c.url); work = MoaImg.canvasFrom(img); hist = []; fut = []; $('#welcome').classList.add('hidden'); $('#wrap').classList.remove('hidden'); fit(); renderHist(); };
    const x = el('button',{class:'x', title:'기록 삭제', onclick: async e => { e.stopPropagation(); captures = captures.filter(z => z !== c); try { await db.del('caps', c.id); } catch(er){} renderHist(); }}, '✕');
    h.append(el('div',{class:'h'}, im, x));
  });
  h.append(el('button',{class:'btn sm', style:{flex:'none'}, onclick: async ()=>{ if (await Moa.confirm('캡처 기록을 모두 지울까요?')){ await db.clear('caps'); captures = []; renderHist(); } }}, '기록 비우기'));
}

function addFrame(src, kind){

function clearOv(){ const ov = $('#ov'); const g = ov.getContext('2d'); g.clearRect(0, 0, ov.width, ov.height); return g; }

/* 마우스 처리 */

$('#cv').addEventListener('pointerdown', e => { if (textBox && tool !== 'text') finishText(); }, true);

/* ================= 내보내기 ================= */
function fileName(ext){ const d = new Date(), p = n => String(n).padStart(2, '0'); return S.nameFmt.replace('{날짜}', `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`).replace('{시간}', `${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`) + ext; }
async function save(){
  if (!work) return toast('저장할 그림이 없습니다');
  finishText();
  const body = el('div',{style:{width:'min(380px,80vw)'}, html:`<label class="field"><span>파일 이름</span><input type="text" id="fn" value="${esc(fileName(''))}"></label>
    <label class="field"><span>형식</span><select id="ff"><option value="image/png">PNG (선명, 권장)</option><option value="image/jpeg">JPG (작은 크기)</option><option value="image/webp">WEBP</option></select></label>
    <label class="field"><span>품질 (JPG/WEBP)</span><input type="range" id="fq" min="40" max="100" value="${Math.round(S.quality * 100)}"></label><div class="dim" id="fe"></div>`});
  body.querySelector('#ff').value = S.fmt;
  const est = async () => { const b = await Moa.canvasToBlob(work, body.querySelector('#ff').value, body.querySelector('#fq').value / 100); body.querySelector('#fe').textContent = '예상 크기: ' + Moa.fmtBytes(b.size); };
  body.querySelector('#ff').onchange = est; body.querySelector('#fq').onchange = est; est();
  const r = await Moa.modal({title:'저장', body, width:'auto', buttons:[{label:'취소', value:null}, {label:'저장', primary:true, onClick:()=>({n:body.querySelector('#fn').value.trim() || fileName(''), f:body.querySelector('#ff').value, q:body.querySelector('#fq').value / 100})}]});
  if (!r) return;
  S.fmt = r.f; S.quality = r.q; saveS();
  const blob = await Moa.canvasToBlob(work, r.f, r.q);
  if (await Moa.saveAs(blob, r.n + {'image/png':'.png','image/jpeg':'.jpg','image/webp':'.webp'}[r.f])){ dirty = false; setStatus('저장했습니다'); }
}
async function copyImg(silent){
  if (!work) return; finishText();
  try { const b = await Moa.canvasToBlob(work, 'image/png'); await navigator.clipboard.write([new ClipboardItem({'image/png': b})]); if (!silent) toast('클립보드로 복사했습니다. 다른 프로그램에서 Ctrl+V 하세요.'); }
  catch(e){ if (!silent) toast('복사할 수 없습니다: ' + e.message); }
}
function copyText(t){ navigator.clipboard.writeText(t).catch(() => {}); }
function printImg(){
  if (!work) return; finishText();
  const url = work.toDataURL('image/png'); const fr = el('iframe',{style:{position:'fixed', width:0, height:0, border:0}}); document.body.append(fr);
  const d = fr.contentDocument; d.open(); d.write(`<!doctype html><title>인쇄</title><style>@page{margin:10mm}body{margin:0}img{max-width:100%;max-height:96vh;display:block;margin:auto}</style><img src="${url}">`); d.close();
  d.images[0].onload = () => { try { fr.contentWindow.print(); } catch(e){} setTimeout(() => fr.remove(), 60000); };
}
async function savePdf(){
  if (!work) return; finishText();
  const doc = await PDFLib.PDFDocument.create(); const png = await doc.embedPng(new Uint8Array(await (await Moa.canvasToBlob(work, 'image/png')).arrayBuffer()));
  const w = work.width * .75, h = work.height * .75; const pg = doc.addPage([w, h]); pg.drawImage(png, {x:0, y:0, width:w, height:h});
  doc.setProducer('HANAI Capture'); const bytes = await doc.save();
  await Moa.saveAs(new Blob([bytes], {type:'application/pdf'}), fileName('.pdf'));
}
async function eyedrop(){
  if (!window.EyeDropper) return toast('이 브라우저는 화면 색 추출을 지원하지 않습니다 (Chrome·Edge 필요)');
  try { const r = await new EyeDropper().open(); const hex = r.sRGBHex; const n = parseInt(hex.slice(1), 16); S.color = hex; saveS(); renderProps(); copyText(hex.toUpperCase());
    Moa.modal({title:'색 추출', body:`<div class="row" style="gap:14px"><div style="width:64px;height:64px;border-radius:10px;background:${hex};border:1px solid var(--line)"></div><div style="line-height:1.9;font-family:Consolas,monospace">HEX ${hex.toUpperCase()}<br>RGB ${n >> 16}, ${(n >> 8) & 255}, ${n & 255}<br><span class="dim" style="font-family:inherit">HEX 값을 복사했고, 그리기 색으로 정했습니다.</span></div></div>`}); } catch(e){}
}

/* ================= 글자 추출 (OCR) ================= */
async function ocrImage(){
  if (!work) return toast('먼저 캡처하거나 그림을 여세요');
  finishText();
  const lang = MoaOnline.langSelect(S.ocrLang || 'kor+eng');
  const ok = await Moa.modal({title:'글자 추출 (OCR)', body: el('div',null, el('div',{class:'dim', style:{marginBottom:'8px'}}, '그림 속 글자를 읽어 텍스트로 바꿉니다. 처음 한 번은 인터넷 연결이 필요합니다.'), el('label',{class:'field'}, el('span',null,'언어'), lang)), buttons:[{label:'취소', value:false}, {label:'인식 시작', primary:true, value:true}]});
  if (!ok) return;
  S.ocrLang = lang.value; saveS();
  const prog = MoaOnline.progress('글자 인식 중');
  try {
    const src = Math.max(work.width, work.height) < 1200 ? MoaImg.resizeCanvas(work, work.width * 2, work.height * 2) : work;
    const r = await MoaOnline.ocr(src, {lang:lang.value, onStatus: t => prog.set(null, t)});
    prog.close(); MoaOnline.showText(r.text, '글자 추출 결과', fileName(''));
  } catch(e){ prog.close(); Moa.alert(e.message || String(e), '글자 추출 실패'); }
}

/* ================= 설정 / 도움말 ================= */
function settings(){
  const body = el('div',{style:{width:'min(460px,86vw)'}, html:`
    <label class="chk" style="display:flex;margin:6px 0"><input type="checkbox" id="s1" ${S.autoCopy ? 'checked' : ''}> 캡처하면 자동으로 클립보드에 복사</label>
    <label class="chk" style="display:flex;margin:6px 0"><input type="checkbox" id="s2" ${S.keepShare ? 'checked' : ''}> 공유 화면을 유지해 다음 캡처 때 다시 묻지 않기</label>
    <label class="chk" style="display:flex;margin:6px 0"><input type="checkbox" id="s3" ${S.cursor ? 'checked' : ''}> 마우스 커서도 함께 캡처</label>
    <label class="chk" style="display:flex;margin:6px 0"><input type="checkbox" id="s5" ${S.delayRegion ? 'checked' : ''}> 지연 캡처 후 영역 지정하기</label>
    <label class="field"><span>파일 이름 규칙</span><input type="text" id="s4" value="${esc(S.nameFmt)}"></label><div class="dim" style="font-size:11.5px">{날짜} {시간} 을 쓸 수 있습니다</div>`});
  Moa.modal({title:'설정', body, width:'auto', buttons:[{label:'취소', value:null}, {label:'확인', primary:true, onClick:()=>{ S.autoCopy = body.querySelector('#s1').checked; S.keepShare = body.querySelector('#s2').checked; S.cursor = body.querySelector('#s3').checked; S.delayRegion = body.querySelector('#s5').checked; S.nameFmt = body.querySelector('#s4').value || S.nameFmt; saveS(); if (!S.keepShare) stopShare(); }}]});
}
function help(){
  Moa.modal({title:'HANAI Capture 도움말', width:600, body:`<p style="margin-top:0"><b>캡처:</b> 영역 지정·전체 화면·창·지연 캡처를 누르면 브라우저가 공유할 화면(전체 화면/창/탭)을 묻습니다. 고른 화면은 '대상 바꾸기' 전까지 유지되어, 다음부터는 바로 찍힙니다. 영역 지정에서는 돋보기로 픽셀 단위까지 맞출 수 있습니다.</p>
  <p><b>편집:</b> 왼쪽 도구로 펜·형광펜·화살표·도형·글자·번호·모자이크·흐림·강조·자르기를 쓰고, 오른쪽에서 색·굵기·크기를 고릅니다. 결과는 저장(PNG/JPG/WEBP/PDF)·복사·인쇄할 수 있습니다.</p>
  <p><b>글자 추출:</b> 캡처한 그림 속 글자를 텍스트로 읽어 복사할 수 있습니다(OCR). 처음 한 번은 인터넷 연결이 필요합니다.</p>
  <p class="dim">브라우저 보안 때문에 Print Screen 같은 시스템 전역 단축키와 스크롤 캡처는 쓸 수 없습니다. 윈도우 <span class="kbd">Win</span>+<span class="kbd">Shift</span>+<span class="kbd">S</span>로 찍고 여기서 <span class="kbd">Ctrl</span>+<span class="kbd">V</span>로 붙여 편집하는 방법도 편리합니다.</p>` +
  Moa.shortcutTable([['Ctrl+Shift+A','영역 지정 캡처'],['Ctrl+Shift+F','전체 화면 캡처'],['Ctrl+Shift+W','창 캡처'],['Ctrl+Shift+D','지연 캡처'],['Ctrl+Shift+C','화면 색 추출'],['Ctrl+Shift+T','글자 추출 (OCR)'],['Ctrl+V','클립보드 그림 붙여넣기'],['Ctrl+C','복사'],['Ctrl+S','저장'],['Ctrl+P','인쇄'],['Ctrl+Z / Ctrl+Y','실행 취소 / 다시 실행'],['P H L A R E T N M B S X','펜·형광펜·선·화살표·사각형·원·글자·번호·모자이크·흐림·강조·자르기'],['Enter','자르기 적용'],['Ctrl + 휠','확대 / 축소']])});
}

/* ================= 단축키 ================= */
const KEYS = {p:'pen', h:'hl', l:'line', a:'arrow', r:'rect', e:'ellipse', t:'text', n:'number', m:'mosaic', b:'blur', s:'spot', x:'crop', i:'pick'};
document.addEventListener('keydown', e => {
  if (document.querySelector('.moa-modal-bg,.region')) return;
  if (e.target.matches('input,textarea,select,.textedit')) return;
  const k = e.key, c = e.ctrlKey || e.metaKey;
  if (c && e.shiftKey){ const m = {A:'region', F:'full', W:'window', D:'delay'}[k.toUpperCase()]; if (m){ e.preventDefault(); capture(m); return; } if (k.toUpperCase() === 'C'){ e.preventDefault(); eyedrop(); return; } if (k.toUpperCase() === 'T'){ e.preventDefault(); ocrImage(); return; } }
  if (c && (k === 'z' || k === 'Z')){ e.preventDefault(); undo(); }
  else if (c && (k === 'y' || k === 'Y')){ e.preventDefault(); redo(); }
  else if (c && (k === 's' || k === 'S')){ e.preventDefault(); save(); }
  else if (c && (k === 'c' || k === 'C')){ e.preventDefault(); copyImg(); }
  else if (c && (k === 'p' || k === 'P')){ e.preventDefault(); printImg(); }
  else if (c && (k === 'o' || k === 'O')){ e.preventDefault(); openFile(); }
  else if (c && (k === '=' || k === '+')){ e.preventDefault(); setZoom(zoom * 1.25); }
  else if (c && k === '-'){ e.preventDefault(); setZoom(zoom / 1.25); }
  else if (c && k === '0'){ e.preventDefault(); fit(); }
  else if (c) return;
  else if (k === 'Enter'){ applyCrop(); }
  else if (k === 'Escape'){ clearOv(); cropRect = null; }
  else if (KEYS[k.toLowerCase()] && work){ setTool(KEYS[k.toLowerCase()]); }
  else if (k === 'F1'){ e.preventDefault(); help(); }
});
window.addEventListener('resize', () => { if (work && zoom <= 1) fit(); });
window.addEventListener('beforeunload', e => { stopShare(); if (dirty){ e.preventDefault(); e.returnValue = ''; } });

setTool('arrow'); loadHistory(); renderHist();
window.MoaCap = {loadCanvas, setTool, get work(){ return work; }, selectRegion, applyCrop};
})();
</script>
