<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%237c8cff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANAI PDF - HANAI Tools PDF 프로그램</title>
<link rel="stylesheet" href="../lib/moa.css">
<style>
.subbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.subbar .pg{width:52px;text-align:center}
.subbar select{padding:3px 6px}
.subbar input[type=search]{width:200px}
.annobar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.annobar .ibtn.on{background:var(--accent);color:var(--accentText)}
.annobar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.body{flex:1;display:grid;grid-template-columns:190px 1fr;min-height:0}
.body.nosb{grid-template-columns:0 1fr}
.side{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:8px 6px}
.tcard{margin:0 auto 10px;width:150px;cursor:pointer;text-align:center;font-size:11px;color:var(--dim);border-radius:8px;padding:5px;border:2px solid transparent}
.tcard canvas{display:block;margin:0 auto 4px;box-shadow:0 1px 4px rgba(0,0,0,.3);background:#fff;max-width:136px}
.tcard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tcard.cur{color:var(--accent);font-weight:700}
.tcard.drop{border-top:3px solid var(--warn)}
.view{overflow:auto;position:relative;background:var(--bg2)}
.pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 10px 60px}
.page{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);flex:none}
.page canvas.bmp{position:absolute;inset:0;width:100%;height:100%}
.page canvas.anno{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.page .pno{position:absolute;left:-2px;top:-20px;font-size:11px;color:var(--dim)}
.page.cur{outline:2px solid var(--accent)}
.view.tool .page canvas.anno{cursor:crosshair}
.view.tool .textLayer{pointer-events:none}
.view.tool-select .page canvas.anno{cursor:default}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer{--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer > :not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer ::selection{background:rgba(0,90,255,.3)}
.textLayer span.hit{background:rgba(255,200,0,.45);border-radius:2px}
.textLayer span.hit.now{background:rgba(255,100,0,.6)}
.org{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--og,180px),1fr));gap:16px;padding:16px;align-content:start}
.ocard{position:relative;text-align:center;font-size:12px;color:var(--dim);border:2px solid transparent;border-radius:10px;padding:8px;cursor:pointer;user-select:none}
.ocard canvas{max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#fff}
.ocard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ocard .acts{position:absolute;top:6px;right:6px;display:none;gap:2px}
.ocard:hover .acts{display:flex}
.ocard .acts button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center}
.ocard .acts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.ocard.drop{border-left:4px solid var(--warn)}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100%;color:var(--dim);text-align:center;padding:30px}
.welcome .cards{display:grid;grid-template-columns:repeat(4,170px);gap:12px}
@media (max-width:820px){.welcome .cards{grid-template-columns:repeat(2,170px)}}
.welcome .card{padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;color:var(--text)}
.welcome .card:hover{border-color:var(--accent)}
.welcome .card svg{width:36px;height:36px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.welcome .card b{display:block;margin:6px 0 2px}
.welcome .card span{font-size:11.5px;color:var(--dim)}
.flist{border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto}
.flist div{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.flist div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigpad{background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
/* ── 2026-11-27: 폰 화면·처음으로·원래 순서 ── */
.moa-app{height:100vh;height:100dvh}
.moa-toolbar .tb{flex:none}
#docTitle{cursor:pointer}
#docTitle:hover{text-decoration:underline}
#view{touch-action:pan-x pan-y}
.view.tool .page canvas.anno{touch-action:none}
.orgbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:color-mix(in srgb,var(--accent2) 8%,var(--panel));border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.orgbar .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.orgbar .hint{color:var(--dim);font-size:11.5px}
.ocard{-webkit-touch-callout:none}
.ocard.dragging{opacity:.3}
.ocard .acts button.more{font-weight:700;font-size:15px;line-height:1}
.drag-ghost{position:fixed;z-index:3000;pointer-events:none;opacity:.9;box-shadow:var(--shadow);border-radius:8px;background:var(--panel);padding:4px;border:2px solid var(--accent)}
.drag-ghost canvas{display:block;max-width:96px;background:#fff}
.drag-ghost b{position:absolute;right:-8px;top:-8px;background:var(--accent);color:var(--accentText);border-radius:10px;padding:0 6px;font-size:11px}
.flist .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.savename{display:flex;align-items:center;gap:4px}
.savename input{flex:1;min-width:0;font-size:16px!important;padding:8px!important}
@media (hover:none){.ocard .acts{display:flex;position:static;justify-content:center;margin-bottom:4px}}
@media (max-width:700px){
  .moa-title{padding:5px 8px;gap:8px}
  .moa-title .sub:not(#docBadge){display:none}
  .moa-title h1{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .moa-toolbar{padding:3px 4px;scroll-snap-type:x proximity}
  .tb{min-width:50px;padding:4px 5px;font-size:10.5px}
  .tb svg{width:20px;height:20px}
  .subbar{gap:3px;padding:4px 6px}
  .subbar .pg{width:40px}
  .subbar .grow{display:none}
  #bZo,#bZi{display:none}
  .subbar input[type=search]{width:auto;flex:1 1 140px;order:10;font-size:16px}
  #findInfo{order:11}
  .body,.body.nosb{grid-template-columns:1fr;position:relative}
  .side{position:absolute;left:0;top:0;bottom:0;width:168px;z-index:20;box-shadow:var(--shadow);transform:translateX(-110%);transition:transform .18s;visibility:hidden}
  .body.sbopen .side{transform:none;visibility:visible}
  .pages{padding:12px 4px 70px;gap:10px}
  .page .pno{top:-16px;left:2px}
  .welcome{padding:16px 12px;justify-content:flex-start;gap:12px}
  .welcome .cards{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;max-width:440px}
  .welcome .card{padding:12px 6px}
  .org{--og:120px;gap:8px;padding:8px 6px 70px}
  .ocard{padding:4px}
  .ocard .acts{top:2px;right:2px}
  .ocard .acts button{width:30px;height:30px}
  .moa-status{gap:8px;padding:3px 8px}
  #stInfo{display:none}
  .annobar input[type=range]{width:60px!important}
  .moa-modal .field{grid-template-columns:84px 1fr}
}
</style>
</head>
<body>
<div class="moa-app">
  <div class="moa-title"><div class="moa-logo">P</div><h1 id="docTitle" title="눌러서 파일 이름 바꾸기">HANAI PDF</h1><span class="sub">HANAI Tools PDF 프로그램</span><span class="grow"></span><span class="sub" id="docBadge"></span></div>
  <div class="moa-toolbar" id="toolbar"></div>
  <div class="subbar" id="subbar">
    <button class="ibtn" id="bSide" title="썸네일 창 보이기/숨기기"></button>
    <button class="ibtn" id="bPrev" title="이전 쪽 (PageUp)"></button>
    <input type="text" class="pg" id="pgNow" value="0"><span class="dim" id="pgTotal">/ 0</span>
    <button class="ibtn" id="bNext" title="다음 쪽 (PageDown)"></button>
    <span style="width:8px"></span>
    <button class="ibtn" id="bZo" title="축소 (Ctrl+-)"></button>
    <select id="zoomSel"><option value="width">너비 맞춤</option><option value="page">쪽 맞춤</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option></select>
    <button class="ibtn" id="bZi" title="확대 (Ctrl++)"></button>
    <span style="width:8px"></span>
    <button class="btn sm" id="bMode" title="보기 / 페이지 정리 전환">▦ 페이지 정리</button>
    <button class="btn sm" id="bAnno" title="펜·형광펜·글상자·서명 등 (편집 모드)">✎ 주석·서명</button>
    <button class="btn sm hidden" id="bReset" title="쪽 순서를 처음 열었을(합쳤을) 때로 되돌립니다">↺ 원래 순서</button>
    <span class="grow"></span>
    <input type="search" id="find" placeholder="본문 찾기 (Ctrl+F)">
    <span class="dim" id="findInfo"></span>
  </div>
  <div class="annobar hidden" id="annobar"></div>
  <div class="orgbar hidden" id="orgbar"></div>
  <div class="body" id="body">
    <div class="side" id="side"></div>
    <div class="view" id="view"><div class="pages" id="pages"></div><div class="org hidden" id="org"></div>
      <div class="welcome" id="welcome">
        <div style="font-size:18px;color:var(--text);font-weight:700">무엇을 할까요?</div>
        <div class="cards">
          <div class="card" data-a="open"><svg viewBox="0 0 24 24"></svg><b>PDF 열기</b><span>보기 · 찾기 · 인쇄</span></div>
          <div class="card" data-a="merge"><svg viewBox="0 0 24 24"></svg><b>PDF 합치기</b><span>여러 PDF를 하나로</span></div>
          <div class="card" data-a="img2pdf"><svg viewBox="0 0 24 24"></svg><b>이미지 → PDF</b><span>사진·스캔을 PDF로</span></div>
          <div class="card" data-a="split"><svg viewBox="0 0 24 24"></svg><b>PDF 나누기</b><span>쪽별·범위별 분할</span></div>
          <div class="card" data-a="pdf2img"><svg viewBox="0 0 24 24"></svg><b>PDF → 이미지</b><span>JPG·PNG로 변환</span></div>
          <div class="card" data-a="sign"><svg viewBox="0 0 24 24"></svg><b>서명 · 주석</b><span>서명·도장·메모 넣기</span></div>
          <div class="card" data-a="watermark"><svg viewBox="0 0 24 24"></svg><b>워터마크 · 쪽 번호</b><span>모든 쪽에 넣기</span></div>
          <div class="card" data-a="compress"><svg viewBox="0 0 24 24"></svg><b>PDF 압축</b><span>파일 크기 줄이기</span></div>
        </div>
        <div>PDF나 이미지 파일을 이 창에 끌어다 놓아도 됩니다. 스캔 PDF는 도구 모음의 <b>문자 인식</b>으로 글자를 찾을 수 있게 만드세요.</div>
      </div>
    </div>
  </div>
  <div class="moa-status"><span class="grow" id="status">준비</span><span id="stSel"></span><span id="stInfo"></span></div>
</div>
<script src="../lib/pdfjs.js"></script>
<script src="../lib/pdfjs-worker.js"></script>
<script src="../lib/pdfjs-data.js"></script>
<script src="../lib/pdf-lib.min.js"></script>
<script src="../lib/pako.min.js"></script>
<script src="../lib/moa-common.js"></script>
<script src="../lib/moa-zip.js"></script>
<script src="../lib/moa-pdf.js"></script>
<script src="../lib/moa-online.js"></script>
<script>
(() => {
'use strict';
const {$, el, esc, toast, icon} = Moa;
Moa.applyTheme('pdf');
const {PDFDocument, degrees, StandardFonts} = PDFLib;
const S = Object.assign({zoom:'width', side:true, dpi:150, imgFmt:'image/jpeg', annoColor:'#e53935', annoWidth:3, textSize:16}, Moa.store.get('moapdf.settings', {}));
const saveS = () => Moa.store.set('moapdf.settings', S);
const A4 = [595.28, 841.89];

/* ================= 상태 ================= */
let sources = new Map();  // id → {id, kind:'pdf'|'image'|'blank', name, bytes, pdf, encrypted, size:[w,h], img}
let pages = [];           // {id, src, idx, rot, objs:[]}
let fileName = '';
let origPages = [];        // 처음 열었을(합쳤을) 때의 쪽 순서 {id, src, idx, rot}
let multiSel = false;      // 페이지 정리: 눌러서 여러 쪽 고르기 (폰)
const narrow = () => matchMedia('(max-width:700px)').matches;
let modified = false;
let meta = {title:'', author:'', subject:'', keywords:''};
let deco = {wm:null, pn:null}; // 워터마크, 쪽 번호 설정
let selected = new Set(), lastSel = null, curPage = 0, mode = 'view', tool = null;
let undoStack = [], redoStack = [];
let uid = 1; const nid = () => uid++;
const pageCache = new Map(); // `${srcId}:${idx}` → pdf.js page

/* ================= 툴바 ================= */
Moa.toolbar($('#toolbar'), [
  {icon:'home', label:'처음으로', title:'열린 문서를 닫고 처음 화면으로 (아무 작업도 시작하지 않은 상태)', onClick:()=>goHome()},
  {icon:'open', label:'열기', title:'PDF 열기 (Ctrl+O)', onClick:()=>openPdf()},
  {icon:'save', label:'저장', title:'PDF로 저장 (Ctrl+S)', onClick:()=>saveDoc()},
  {icon:'print', label:'인쇄', title:'인쇄 (Ctrl+P)', onClick:()=>printDoc()},
  '|',
  {icon:'merge', label:'합치기', title:'여러 PDF 합치기', onClick:()=>mergeDialog()},
  {icon:'split', label:'나누기', title:'PDF 나누기', onClick:()=>splitDialog()},
  {icon:'pages', label:'쪽 추출', title:'선택한 쪽만 새 PDF로', onClick:()=>extractPages()},
  {icon:'plus', label:'쪽 삽입', title:'다른 PDF·이미지·빈 쪽 삽입', onClick:e=>insertMenu(e)},
  {icon:'rotR', label:'회전', title:'선택한 쪽 오른쪽 90° 회전 (Ctrl+R)', onClick:()=>rotateSel(90)},
  {icon:'trash', label:'쪽 삭제', title:'선택한 쪽 삭제 (Delete)', onClick:()=>deleteSel()},
  '|',
  {icon:'image', label:'이미지→PDF', onClick:()=>imagesToPdf()},
  {icon:'convert', label:'PDF→이미지', onClick:()=>pdfToImages()},
  {icon:'text', label:'텍스트 추출', onClick:()=>extractText()},
  {icon:'search', label:'문자 인식', title:'스캔한 PDF의 글자 인식(OCR) — 검색 가능한 PDF 만들기', onClick:()=>ocrDialog()},
  '|',
  {icon:'watermark', label:'워터마크', onClick:()=>watermarkDialog()},
  {icon:'hash', label:'쪽 번호', onClick:()=>pageNumDialog()},
  {icon:'sign', label:'서명', title:'서명 만들어 넣기', onClick:()=>signatureDialog()},
  {icon:'zip', label:'압축', title:'PDF 용량 줄이기', onClick:()=>compressDialog()},
  {icon:'info', label:'문서 정보', onClick:()=>propsDialog()},
  '|',
  {icon:'undo', label:'실행 취소', title:'실행 취소 (Ctrl+Z)', onClick:()=>undo()},
  {icon:'palette', label:'스킨', onClick:e=>Moa.themeMenu('pdf', e.clientX, e.clientY+10)},
  {icon:'help', label:'도움말', onClick:()=>help()},
]);
$('#bSide').innerHTML = icon('list'); $('#bPrev').innerHTML = icon('up'); $('#bNext').innerHTML = icon('down'); $('#bZo').innerHTML = icon('zoomOut'); $('#bZi').innerHTML = icon('zoomIn');
const wIcons = {open:'open', merge:'merge', img2pdf:'image', split:'split', pdf2img:'convert', sign:'sign', watermark:'watermark', compress:'zip'};
document.querySelectorAll('.welcome .card').forEach(c => { c.querySelector('svg').innerHTML = Moa.icons[wIcons[c.dataset.a]]; c.onclick = () => ({open:openPdf, merge:mergeDialog, img2pdf:imagesToPdf, split:()=>openPdf().then(()=>pages.length && splitDialog()), pdf2img:()=>openPdf().then(()=>pages.length && pdfToImages()), sign:()=>openPdf().then(()=>pages.length && signatureDialog()), watermark:()=>openPdf().then(()=>pages.length && watermarkDialog()), compress:()=>openPdf().then(()=>pages.length && compressDialog())})[c.dataset.a](); });
$('#zoomSel').value = S.zoom;
$('#body').classList.toggle('nosb', !S.side);

function setStatus(s){ $('#status').textContent = s; }
function markModified(v = true){ modified = v; updateTitle(); }
function updateTitle(){
  $('#docTitle').textContent = fileName ? (modified ? '* ' : '') + fileName : 'HANAI PDF';
  document.title = (fileName ? (modified ? '* ' : '') + fileName + ' - ' : '') + 'HANAI PDF';
  const enc = [...sources.values()].some(s => s.encrypted);
  $('#docBadge').textContent = pages.length ? `${pages.length}쪽` + (enc ? ' · 암호/보호 문서 포함' : '') + (deco.wm ? ' · 워터마크' : '') + (deco.pn ? ' · 쪽 번호' : '') : '';
  $('#welcome').classList.toggle('hidden', pages.length > 0);
  $('#pgTotal').textContent = '/ ' + pages.length;
  $('#bReset').classList.toggle('hidden', !(pages.length && origPages.length));
}

/* ================= 실행 취소 ================= */
const snap = () => ({pages: pages.map(p => ({...p, objs: p.objs.map(o => ({...o}))})), deco: JSON.parse(JSON.stringify(deco))});
function pushUndo(){ undoStack.push(snap()); if (undoStack.length > 60) undoStack.shift(); redoStack = []; }
function undo(){ if (!undoStack.length) return toast('취소할 작업이 없습니다'); redoStack.push(snap()); const s = undoStack.pop(); pages = s.pages; deco = s.deco; markModified(); rebuild(); }
function redo(){ if (!redoStack.length) return; undoStack.push(snap()); const s = redoStack.pop(); pages = s.pages; deco = s.deco; markModified(); rebuild(); }

/* ================= 불러오기 ================= */
async function askPw(name, wrong){ return Moa.prompt(wrong ? `암호가 틀렸습니다. 다시 입력하세요 - ${name}` : `암호로 보호된 PDF입니다. 암호를 입력하세요 - ${name}`, '', {type:'password'}); }
async function loadPdfSource(file){
  const bytes = new Uint8Array(await file.arrayBuffer());
  const pdf = await MoaPDF.load(bytes, wrong => askPw(file.name, wrong));
  let encrypted = false;
  try { await PDFDocument.load(bytes, {updateMetadata:false}); } catch(e){ encrypted = /encrypt/i.test(e.message) || e.constructor?.name === 'EncryptedPDFError'; if (!encrypted) console.warn('pdf-lib 로드 경고', e); }
  const src = {id: nid(), kind:'pdf', name:file.name, bytes, pdf, encrypted, numPages: pdf.numPages};
  sources.set(src.id, src);
  return src;
}
async function openPdf(files){
  if (!files){ files = await Moa.pickFiles({accept:'.pdf,application/pdf,image/*'}); if (!files.length) return; }
  if (modified && pages.length && !(await Moa.confirm('저장하지 않은 변경 내용이 있습니다. 버리고 새 파일을 열까요?'))) return;
  resetDoc();
  await addFiles(files, null, true);
}
function resetDoc(){ origPages = []; sources = new Map(); pages = []; pageCache.clear(); selected.clear(); undoStack = []; redoStack = []; deco = {wm:null, pn:null}; meta = {title:'', author:'', subject:'', keywords:''}; fileName = ''; curPage = 0; markModified(false); rebuild(); }
async function addFiles(files, at, first){
  const pdfs = files.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  const imgs = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name));
  if (!pdfs.length && !imgs.length) return toast('PDF나 이미지 파일이 아닙니다');
  const newPages = [];
  for (const f of pdfs){

function moveBy(d){
  const s = selPages(); if (!s.length) return;
  const idx = s.map(p => pages.indexOf(p)).sort((a, b) => a - b);
  if (d < 0 ? idx[0] === 0 : idx[idx.length - 1] === pages.length - 1) return toast(d < 0 ? '이미 맨 앞입니다' : '이미 맨 뒤입니다');
  pushUndo();
  const order = d < 0 ? idx : [...idx].reverse();
  for (const i of order){ const j = i + d; [pages[i], pages[j]] = [pages[j], pages[i]]; }
  curPage = Math.max(0, Math.min(pages.length - 1, curPage + d));
  markModified(); rebuild();

/* ── 손가락으로 쪽 끌기 (페이지 정리 화면, 꾹 누르기) ── */
const touchDrag = {busy:false};
(function(){
  const box = $('#org'); let st = null, ghost = null, target = null, scrollT = null;
  const clear = () => { clearTimeout(st && st.timer); cancelAnimationFrame(scrollT); scrollT = null; box.querySelectorAll('.drop,.dragging').forEach(x => x.classList.remove('drop', 'dragging')); ghost && ghost.remove(); ghost = null; target = null; st = null; setTimeout(() => touchDrag.busy = false, 50); };
  box.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ clear(); return; }
    const c = e.target.closest('.ocard'); if (!c || c.dataset.i == null || e.target.closest('.acts')) return;
    const t = e.touches[0];
    st = {c, x:t.clientX, y:t.clientY, on:false, timer:setTimeout(() => begin(), 380)};
  }, {passive:true});
  function begin(){
    if (!st) return; st.on = true; touchDrag.busy = true;
    const i = +st.c.dataset.i;
    if (!selected.has(pages[i].id)){ if (!multiSel) selected.clear(); selected.add(pages[i].id); lastSel = pages[i].id; refreshSel(); }
    const n = selected.size;
    box.querySelectorAll('.ocard').forEach(c => { if (c.dataset.i != null && selected.has(pages[+c.dataset.i].id)) c.classList.add('dragging'); });
    ghost = el('div',{class:'drag-ghost'}); const cv = st.c.querySelector('canvas');
    if (cv && cv.width){ const g = el('canvas',{width:cv.width, height:cv.height}); g.getContext('2d').drawImage(cv, 0, 0); ghost.append(g); }
    if (n > 1) ghost.append(el('b',null, n + '쪽'));
    document.body.append(ghost); place(st.x, st.y);
    if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
  }
  function place(x, y){ if (ghost){ ghost.style.left = (x - 40) + 'px'; ghost.style.top = (y - 50) + 'px'; } }
  function autoscroll(y){
    cancelAnimationFrame(scrollT);
    const v = $('#view').getBoundingClientRect(), edge = 60;
    const sp = y < v.top + edge ? -(v.top + edge - y) / 4 : y > v.bottom - edge ? (y - (v.bottom - edge)) / 4 : 0;
    if (sp){ const step = () => { $('#view').scrollTop += sp; scrollT = requestAnimationFrame(step); }; scrollT = requestAnimationFrame(step); }
  }
  box.addEventListener('touchmove', e => {
    if (!st) return; const t = e.touches[0];
    if (!st.on){ if (Math.hypot(t.clientX - st.x, t.clientY - st.y) > 10){ clearTimeout(st.timer); st = null; } return; }
    e.preventDefault(); place(t.clientX, t.clientY); autoscroll(t.clientY);
    const over = document.elementFromPoint(t.clientX, t.clientY); const c = over && over.closest && over.closest('.ocard');
    box.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
    target = c && box.contains(c) ? c : null; if (target) target.classList.add('drop');
  }, {passive:false});
  const end = e => {
    if (!st) return; if (!st.on){ clearTimeout(st.timer); st = null; return; }
    e.preventDefault();
    const c = target;
    if (c){
      const tp = c.dataset.i != null ? pages[+c.dataset.i] : null;
      if (!tp || !selected.has(tp.id)){
        pushUndo(); const moving = pages.filter(p => selected.has(p.id)), rest = pages.filter(p => !selected.has(p.id));
        let at = tp ? rest.indexOf(tp) : rest.length; if (at < 0) at = rest.length;
        rest.splice(at, 0, ...moving); pages = rest; markModified();
        clear(); rebuild(); toast(`${moving.length}쪽을 옮겼습니다`); return;
      }
    }
    clear();
  };
  box.addEventListener('touchend', end, {passive:false});
  box.addEventListener('touchcancel', () => clear());
})();
/* ── 두 손가락으로 확대·축소 (보기 화면) ── */
(function(){
  const view = $('#view'); let pz = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  view.addEventListener('touchstart', e => {
    if (e.touches.length !== 2 || mode !== 'view' || !pages.length || tool) return;
    const r = view.getBoundingClientRect();
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
    pz = {d0:dist(e.touches), k:1, cx, cy, sx:view.scrollLeft, sy:view.scrollTop};
    const pg = $('#pages'); pg.style.transformOrigin = `${cx + view.scrollLeft}px ${cy + view.scrollTop}px`;
  }, {passive:true});
  view.addEventListener('touchmove', e => {
    if (!pz || e.touches.length !== 2) return; e.preventDefault();
    pz.k = Math.max(.25, Math.min(6, dist(e.touches) / pz.d0)); $('#pages').style.transform = `scale(${pz.k})`;
  }, {passive:false});
  const end = async e => {
    if (!pz || e.touches.length >= 2) return;
    const p = pz; pz = null; $('#pages').style.transform = '';
    if (Math.abs(p.k - 1) < .06) return;
    const z = Math.max(.25, Math.min(4, scale * 72 / 96 * p.k)), zs = String(Math.round(z * 100) / 100);
    const kReal = (+zs * 96 / 72) / scale;
    S.zoom = zs; saveS();
    if (![...$('#zoomSel').options].some(o => o.value === zs)) $('#zoomSel').append(el('option',{value:zs}, Math.round(+zs * 100) + '%'));
    $('#zoomSel').value = zs;
    await rebuild();
    view.scrollLeft = (p.sx + p.cx) * kReal - p.cx; view.scrollTop = (p.sy + p.cy) * kReal - p.cy;
  };
  view.addEventListener('touchend', end); view.addEventListener('touchcancel', end);
})();
/* ── 저장: 폰(저장 위치 창이 없는 브라우저)은 이름을 묻고 저장/공유 ── */
const cleanName = (v, d) => (String(v || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, ' ').trim() || d).slice(0, 180);
async function saveOut(blob, name, types){
  if (window.showSaveFilePicker) return (await Moa.saveAs(blob, name, types)) ? {name} : false;
  const ext = (name.match(/\.[a-z0-9]{1,5}$/i) || [''])[0], base = ext ? name.slice(0, -ext.length) : name;
  const inp = el('input',{type:'text', value:base, enterkeyhint:'done', autocomplete:'off'});
  let canShare = false; try { canShare = !!(navigator.canShare && navigator.share && navigator.canShare({files:[new File([blob], 'a' + ext, {type:blob.type || 'application/octet-stream'})]})); } catch(e){}
  const body = el('div',{style:{width:'min(460px,86vw)'}},
    el('div',{class:'dim', style:{marginBottom:'6px'}}, '파일 이름'),
    el('div',{class:'savename'}, inp, el('span',{class:'dim'}, ext)),
    el('div',{class:'dim', style:{fontSize:'12px', marginTop:'10px', lineHeight:'1.7'}}, `${Moa.fmtBytes(blob.size)} · 「저장」은 휴대폰의 다운로드 폴더에 저장합니다.` + (canShare ? ' 「공유」를 누르면 카카오톡·드라이브·메일 등으로 바로 보낼 수 있습니다.' : '')));
  const r = await Moa.modal({title:'저장', body, buttons:[{label:'취소', value:null}, ...(canShare ? [{label:'공유', value:'share'}] : []), {label:'저장', primary:true, value:'save'}]});
  if (!r) return false;
  const nm = cleanName(inp.value, base) + ext;

    catch(e){ if (e.name === 'AbortError') return false; toast('공유하지 못해 다운로드로 저장합니다'); }

const findState = {q:'', hits:[], i:-1};
const textCache = new Map();
async function pageText(p){ const src = sources.get(p.src); if (src.kind !== 'pdf') return ''; const k = p.src + ':' + p.idx; if (!textCache.has(k)){ const pg = await pdfPage(src, p.idx); const tc = await pg.getTextContent(); textCache.set(k, tc.items.map(it => it.str + (it.hasEOL ? '\n' : '')).join('')); } return textCache.get(k); }
async function doFind(q, dir=1){
  if (!q){ findState.q = ''; $('#findInfo').textContent = ''; document.querySelectorAll('.textLayer span.hit').forEach(s => s.classList.remove('hit','now')); return; }
  if (q !== findState.q){
    findState.q = q; findState.hits = []; findState.i = -1; $('#findInfo').textContent = '찾는 중…';
    const ql = q.toLowerCase().replace(/\s+/g, '');
    for (let i = 0; i < pages.length; i++){ const t = (await pageText(pages[i])).toLowerCase().replace(/\s+/g, ''); let pos = t.indexOf(ql), n = 0; while (pos >= 0){ n++; pos = t.indexOf(ql, pos + 1); } for (let k = 0; k < n; k++) findState.hits.push(i); }
    document.querySelectorAll('.textLayer').forEach(tl => highlightIn(tl, +tl.parentNode.dataset.i));
  }
  if (!findState.hits.length){ $('#findInfo').textContent = '찾는 내용 없음'; return; }
  findState.i = (findState.i + dir + findState.hits.length) % findState.hits.length;
  const pi = findState.hits[findState.i];

  } catch(e){ prog.close(); if (e.message !== '취소했습니다') Moa.alert(e.message); }

/* ================= 문자 인식 (OCR) ================= */
async function ocrDialog(){
  if (!pages.length) return toast('먼저 PDF를 여세요');
  const lang = MoaOnline.langSelect(S.ocrLang || 'kor+eng');
  const body = el('div',{style:{width:'min(480px,88vw)'}});
  body.innerHTML = `<div class="dim" style="margin-bottom:8px;line-height:1.6">스캔하거나 사진으로 찍은 PDF에서 글자를 읽어 냅니다. 처음 한 번은 인터넷으로 인식 엔진과 언어 데이터(수 MB)를 받습니다.</div>
    <label class="field"><span>대상 쪽</span><input type="text" id="oR" value="1-${pages.length}"></label>
    <label class="field"><span>언어</span><span id="oL"></span></label>
    <label class="field"><span>정확도</span><select id="oD"><option value="200">보통 (빠름)</option><option value="300" selected>높음 (권장)</option><option value="400">매우 높음 (느림)</option></select></label>
    <label class="chk" style="display:flex;margin:6px 0"><input type="radio" name="oM" value="pdf" checked> <span><b>검색 가능한 PDF로 저장</b> — 보이는 모양은 그대로, 글자 검색·복사가 됩니다</span></label>
    <label class="chk" style="display:flex;margin:6px 0"><input type="radio" name="oM" value="text"> <span><b>글자만 뽑기</b> — 텍스트로 보고 복사·저장</span></label>`;
  body.querySelector('#oL').append(lang);
  const ok = await Moa.modal({title:'문자 인식 (OCR)', body, width:'auto', buttons:[{label:'취소', value:false}, {label:'인식 시작', primary:true, value:true}]});
  if (!ok) return;
  let idx; try { idx = MoaPDF.parseRanges(body.querySelector('#oR').value, pages.length).flat(); } catch(e){ return Moa.alert(e.message); }
  S.ocrLang = lang.value; saveS();
  const mode = body.querySelector('input[name=oM]:checked').value, dpi = +body.querySelector('#oD').value;
  const prog = MoaOnline.progress('문자 인식 중');
  const texts = [], layers = [];
  try {
    for (let k = 0; k < idx.length; k++){
      if (prog.cancelled) throw new Error('취소했습니다');
      const i = idx[k], p = pages[i];
      prog.set(k / idx.length, `${i + 1}쪽 그리는 중…`);
      const c = await renderBase(p, dpi / 72);
      const r = await MoaOnline.ocr(c, {lang:lang.value, dpi, pdf: mode === 'pdf', onStatus: t => prog.set(null, `${i + 1}쪽 (${k + 1}/${idx.length}) · ${t}`)});
      texts.push(`===== ${i + 1}쪽 =====\n${r.text.trim()}\n`);
      layers.push({p, pdf:r.pdf});
    }
    if (mode === 'text'){ prog.close(); MoaOnline.showText(texts.join('\n'), '문자 인식 결과', (fileName || '문서').replace(/\.pdf$/i, '') + '_인식'); return; }
    prog.set(1, '검색 가능한 PDF 만드는 중…');
    const baseBytes = await buildPdf(layers.map(l => l.p));
    const doc = await PDFDocument.load(baseBytes);
    let missing = 0;
    for (let k = 0; k < layers.length; k++){
      const L = layers[k]; if (!L.pdf){ missing++; continue; }
      const od = await PDFDocument.load(L.pdf);
      const [emb] = await doc.embedPdf(od, [0]);
      const page = doc.getPage(k), R = ((page.getRotation().angle % 360) + 360) % 360, box = page.getCropBox ? page.getCropBox() : page.getMediaBox();
      const W = box.width, H = box.height, [dw, dh] = R % 180 ? [H, W] : [W, H];
      const pos = {0:[0, 0], 90:[W, 0], 180:[W, H], 270:[0, H]}[R];
      // 글자 층은 투명(보이지 않는 글자) — 이미지가 같이 들어 있으면 원본과 똑같은 모습으로 덮임
      page.drawPage(emb, {x: box.x + pos[0], y: box.y + pos[1], width: dw, height: dh, rotate: degrees(R)});
    }
    doc.setProducer('HANAI PDF (OCR)');
    const bytes = await doc.save({useObjectStreams:true});
    prog.close();
    if (missing) toast(`${missing}쪽은 글자 층을 만들지 못해 원래대로 두었습니다`, 3500);
    await saveOut(new Blob([bytes], {type:'application/pdf'}), (fileName || '문서').replace(/\.pdf$/i, '') + '_검색가능.pdf');
    textCache.clear();

function help(){

  <p><b>합치기:</b> 고른 파일 순서를 바꾸다가 「↺ 원래대로」로 처음 고른 순서로 돌아갈 수 있고, 합친 파일 이름도 정할 수 있습니다. 합친 뒤 쪽 순서를 바꾸다가 「↺ 원래 순서」를 누르면 합친 직후의 순서로 돌아갑니다(지운 쪽도 다시 살아남).</p>
  <p><b>휴대폰:</b> 썸네일은 왼쪽 위 목록 단추로 열고 닫습니다. 두 손가락으로 확대·축소, 페이지 정리 화면에서 쪽을 꾹 누른 채 끌면 순서가 바뀝니다(「⋯」로 메뉴). 저장할 때 이름을 정하고 「저장」(다운로드 폴더) 또는 「공유」(카카오톡·드라이브 등)를 고릅니다.</p>

  <p><b>문자 인식(OCR):</b> 스캔한 PDF의 글자를 읽어 검색 가능한 PDF로 만들거나 글자만 뽑습니다. 처음 한 번은 인터넷 연결이 필요합니다.</p>

document.addEventListener('keydown', e => {
  if (document.querySelector('.moa-modal-bg')) return;
  const k = e.key, c = e.ctrlKey || e.metaKey;
  if (c && (k === 'o' || k === 'O')){ e.preventDefault(); openPdf(); return; }
  if (c && (k === 's' || k === 'S')){ e.preventDefault(); saveDoc(); return; }
  if (c && (k === 'p' || k === 'P')){ e.preventDefault(); printDoc(); return; }
  if (c && (k === 'f' || k === 'F')){ e.preventDefault(); $('#find').focus(); $('#find').select(); return; }
  if (e.target.matches('input,textarea,select')) return;
  if (c && (k === 'z' || k === 'Z')){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (c && (k === 'y' || k === 'Y')){ e.preventDefault(); redo(); }
  else if (c && (k === 'r' || k === 'R')){ e.preventDefault(); rotateSel(e.shiftKey ? -90 : 90); }
  else if (c && (k === '=' || k === '+')){ e.preventDefault(); zoomStep(1); }
  else if (c && k === '-'){ e.preventDefault(); zoomStep(-1); }
  else if (c && (k === 'a' || k === 'A')){ e.preventDefault(); pages.forEach(p => selected.add(p.id)); refreshSel(); }
  else if (k === 'PageDown' || (k === 'ArrowRight' && mode === 'view' && S.zoom === 'page')){ e.preventDefault(); goPage(curPage + 1); }
  else if (k === 'PageUp' || (k === 'ArrowLeft' && mode === 'view' && S.zoom === 'page')){ e.preventDefault(); goPage(curPage - 1); }
  else if (k === 'Home' && !c){ e.preventDefault(); goPage(0); }
  else if (k === 'End' && !c){ e.preventDefault(); goPage(pages.length - 1); }
  else if (k === 'Delete' || k === 'Backspace'){ if (selObj){ pushUndo(); pages[selObj.page].objs.splice(pages[selObj.page].objs.indexOf(selObj.o), 1); selObj = null; markModified(); refreshAnno(); renderSide(); } else if (k === 'Delete') deleteSel(); }
  else if (k === 'Escape'){ if (tool) setTool(null); selected.clear(); refreshSel(); }
  else if (k === 'F1'){ e.preventDefault(); help(); }
});
window.addEventListener('beforeunload', e => { if (modified){ e.preventDefault(); e.returnValue = ''; } });

updateTitle();
