<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%237c8cff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANAI Photo - HANAI Tools 사진 꾸미기</title>
<link rel="stylesheet" href="lib/moa.css">
<style>
.modtabs{display:flex;gap:2px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.modtabs button{display:flex;align-items:center;gap:6px;padding:8px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--dim);white-space:nowrap}
.modtabs button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.modtabs button:hover{color:var(--text)}
.main{flex:1;display:flex;min-height:0}
.tray{width:210px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.tray .bar{display:flex;gap:2px;padding:5px;border-bottom:1px solid var(--line);align-items:center}
.tray .bar .ibtn{width:28px;height:28px}
.tray .bar .ibtn svg{width:16px;height:16px}
.tray .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:6px;align-content:start}
.tray .th{position:relative;border:2px solid transparent;border-radius:8px;background:var(--bg2);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.tray .th img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.tray .th span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:1px 4px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .th.sel{border-color:var(--accent)}
.tray .foot{padding:4px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.tray .empty{grid-column:1/-1;color:var(--dim);font-size:12px;text-align:center;padding:30px 6px;line-height:1.7}
body.notray .tray{display:none}
.mod{flex:1;min-width:0;display:none;flex-direction:column;min-height:0}
.mod.on{display:flex}
.work{flex:1;display:flex;min-height:0}
.canvasbox{flex:1;min-width:0;position:relative;overflow:hidden;background:repeating-conic-gradient(color-mix(in srgb,var(--bg2) 92%,#888) 0 25%,var(--bg2) 0 50%) 0 0/18px 18px}
.canvasbox canvas.view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.canvasbox .hint{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--dim);text-align:center;pointer-events:none}
.canvasbox .hint svg{width:60px;height:60px;stroke:var(--line);fill:none;stroke-width:1.4}
.canvasbox .hint .btn{pointer-events:auto}
.rpanel{width:300px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rpanel .body{flex:1;overflow:auto;padding:10px}
.ph{font-weight:700;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.ph:first-child{margin-top:0}
.ph .grow{flex:1}
.slid{display:grid;grid-template-columns:62px 1fr 42px;gap:6px;align-items:center;margin:4px 0}
.slid>span:first-child{color:var(--dim);font-size:12px}
.slid>span:last-child{text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums}
.slid input{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chips button{font-size:11.5px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.chips button:hover{border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);font-size:10.5px;color:var(--text)}
.fgrid button.on{border-color:var(--accent);color:var(--accent)}
.fgrid canvas{width:100%;border-radius:4px}
.emoji{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji button{font-size:20px;padding:2px;border:0;background:none;border-radius:6px;line-height:1.2}
.emoji button:hover{background:var(--hover)}
.icongrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.icongrid button{padding:4px;border:0;background:none;border-radius:6px;color:var(--text)}
.icongrid button:hover{background:var(--hover)}
.icongrid svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:6px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.row2 input[type=number]{width:72px}
.row2 input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.tpl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tpl button{aspect-ratio:1;padding:4px;border:1px solid var(--line);border-radius:7px;background:var(--bg2)}
.tpl button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tpl svg{width:100%;height:100%;display:block}
.tpl rect,.tpl ellipse{fill:color-mix(in srgb,var(--accent) 45%,transparent);stroke:none}
.list{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto}
.list .li{display:grid;grid-template-columns:40px 1fr auto;gap:6px;align-items:center;padding:3px 6px;border-bottom:1px solid var(--line);font-size:12px}
.list .li img{width:40px;height:30px;object-fit:cover;border-radius:3px}
.list .li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .li .ibtn{width:22px;height:22px}
.list .li .ibtn svg{width:13px;height:13px}
/* 홈 */
.home{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:30px 20px;gap:20px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 14%,var(--bg)) 0%,var(--bg) 60%)}
.home h2{margin:0;font-size:26px}
.home p{margin:0;color:var(--dim)}
.wheel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(980px,100%)}
.wheel button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);transition:transform .15s,border-color .15s}
.wheel button:hover{transform:translateY(-2px);border-color:var(--accent)}
.wheel .ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff}
.wheel .ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wheel b{font-size:14px}
.wheel small{color:var(--dim);font-size:11px;line-height:1.4;text-align:center}
.wheel .plus{position:relative}
.wheel .plus::after{content:'Plus';position:absolute;top:8px;right:10px;font-size:10px;font-weight:800;color:var(--accent)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table td,.table th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.table th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--panel2)}
.table tr.bad td{color:var(--danger)}
.table tr.same td{color:var(--dim)}
.sw{display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);vertical-align:middle;cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.loupe{position:absolute;width:130px;height:130px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;overflow:hidden;display:none;z-index:5;image-rendering:pixelated}
.loupe canvas{width:100%;height:100%}
.zoomlbl{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:9px;pointer-events:none}
.txtedit{position:absolute;z-index:6;background:rgba(255,255,255,.95);color:#000;border:2px solid var(--accent);border-radius:4px;font:16px "Malgun Gothic",sans-serif;padding:4px;resize:both;min-width:120px;min-height:40px}
@media (max-width:900px){.tray{width:150px}.rpanel{width:250px}}
</style>
</head>
<body>
<div class="moa-app" id="app">
  <div class="moa-title">
    <div class="moa-logo">P</div>
    <h1>HANAI Photo</h1><span class="sub" id="subTitle">HANAI Tools 사진 꾸미기</span>
    <span class="grow"></span>
    <button class="btn sm" id="bSkin">스킨</button>
    <button class="btn sm" id="bHelp">도움말 (F1)</button>
  </div>
  <div class="modtabs" id="modtabs"></div>
  <div class="main">
    <aside class="tray" id="tray">
      <div class="bar" id="trayBar"></div>
      <div class="grid" id="trayGrid"></div>
      <div class="foot" id="trayFoot"></div>
    </aside>
    <div class="mod" id="m-home"></div>
    <div class="mod" id="m-edit"></div>
    <div class="mod" id="m-batch"></div>
    <div class="mod" id="m-page"></div>
    <div class="mod" id="m-join"></div>
    <div class="mod" id="m-gif"></div>
    <div class="mod" id="m-print"></div>
    <div class="mod" id="m-split"></div>
    <div class="mod" id="m-color"></div>
    <div class="mod" id="m-rename"></div>
  </div>
  <div class="moa-status"><span class="grow" id="stMsg">사진을 열거나 왼쪽 서랍에 끌어다 놓으세요</span><span id="stInfo"></span></div>
</div>
<script src="lib/moa-common.js"></script>
<script src="lib/moa-img.js"></script>
<script>
(() => {
'use strict';
const {$, $$, el, esc, toast, icon} = Moa;
Moa.applyTheme('photo');
const PLUS = !!window.MoaOnline;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const baseName = n => String(n || '').replace(/^.*[\\/]/, '').replace(/\.[^.]+$/, '');
const extOf = n => (String(n || '').match(/\.([^.\\/]+)$/) || ['', ''])[1].toLowerCase();
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').slice(0, 150);
const IMG_RE = /\.(jpe?g|png|gif|webp|bmp|avif|svg|ico|jfif|heic|heif)$/i;
const S = Object.assign({fmt:'jpg', q:92, tray:true, lastMod:'home'}, Moa.store.get('hanaiphoto.settings', {}));
const saveS = () => Moa.store.set('hanaiphoto.settings', S);
const status = m => { $('#stMsg').textContent = m; };
const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const ctx2d = c => c.getContext('2d', {willReadFrequently:true});
const clone = c => MoaImg.cloneCanvas(c);

/* ===================== 사진 서랍 ===================== */
let photos = [], traySel = new Set(), uid = 0;
async function loadBitmap(file){
  if (/\.(heic|heif)$/i.test(file.name)){
    if (!PLUS) throw new Error('HEIC(아이폰 사진)는 브라우저가 열 수 없습니다. HANAI Tools Plus의 HANAI Photo에서 열 수 있습니다.');
    const blob = await plusHeic(file); return await createImageBitmap(blob);
  }
  try { return await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ const img = await Moa.loadImage(file); return img; }
}
function bitmapToCanvas(bm){ const c = newCanvas(bm.width || bm.naturalWidth, bm.height || bm.naturalHeight); c.getContext('2d').drawImage(bm, 0, 0); return c; }
async function addPhotos(list, {select=false}={}){
  const added = [];
  for (const x of list){
    const f = x.file || x; if (!IMG_RE.test(f.name) && !/^image\//.test(f.type || '')) continue;
    if (photos.some(p => p.name === f.name && p.size === f.size && p.file.lastModified === f.lastModified)) continue;
    const p = {id:'p' + (++uid), name:f.name, size:f.size, file:f, handle:x.handle || f._handle || null, dir:x.dir || null, w:0, h:0, thumb:''};
    photos.push(p); added.push(p);
  }
  renderTray();
  for (const p of added){
    try { const bm = await loadBitmap(p.file); p.w = bm.width || bm.naturalWidth; p.h = bm.height || bm.naturalHeight; const s = Math.min(1, 176 / Math.max(p.w, p.h)); const c = newCanvas(p.w * s, p.h * s); c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); p.thumb = c.toDataURL('image/jpeg', .8); if (bm.close) bm.close(); }
    catch(e){ p.err = e.message; }
    const t = $(`#trayGrid .th[data-id="${p.id}"]`); if (t) t.replaceWith(thumbEl(p));
  }
  if (select){ traySel = new Set(added.map(p => p.id)); markTray(); }
  updTrayFoot();
  return added;
}
async function getCanvas(p){ const bm = await loadBitmap(p.file); const c = bitmapToCanvas(bm); if (bm.close) bm.close(); return c; }
function thumbEl(p){
  const d = el('div', {class:'th' + (traySel.has(p.id) ? ' sel' : ''), 'data-id':p.id, draggable:'true', title:`${p.name}\n${p.w ? p.w + '×' + p.h + ' · ' : ''}${Moa.fmtBytes(p.size)}${p.err ? '\n' + p.err : ''}`},
    p.thumb ? el('img', {src:p.thumb}) : el('div', {class:'dim', style:{fontSize:'10px'}}, p.err ? '열 수 없음' : '…'), el('span', null, p.name));
  return d;
}
function renderTray(){
  const g = $('#trayGrid'); g.innerHTML = '';
  if (!photos.length) g.append(el('div', {class:'empty'}, '사진 서랍이 비었습니다.', el('br'), '사진·폴더를 여기에 끌어다 놓거나 위 버튼으로 여세요.'));
  photos.forEach(p => g.append(thumbEl(p)));
  updTrayFoot();
}
function markTray(){ $$('#trayGrid .th').forEach(t => t.classList.toggle('sel', traySel.has(t.dataset.id))); updTrayFoot(); }
function updTrayFoot(){ $('#trayFoot').textContent = `${photos.length}장` + (traySel.size ? ` · ${traySel.size}장 선택` : '') + ' · 더블클릭: 지금 화면에 넣기'; }
const selPhotos = () => { const s = photos.filter(p => traySel.has(p.id)); return s.length ? s : []; };
let lastTray = null;
$('#trayGrid').addEventListener('click', e => {
  const t = e.target.closest('.th'); if (!t) { if (e.target === $('#trayGrid')){ traySel.clear(); markTray(); } return; }
  const id = t.dataset.id;
  if (e.shiftKey && lastTray){ const a = photos.findIndex(p => p.id === lastTray), b = photos.findIndex(p => p.id === id); for (let i = Math.min(a, b); i <= Math.max(a, b); i++) traySel.add(photos[i].id); }
  else if (e.ctrlKey || e.metaKey) traySel.has(id) ? traySel.delete(id) : traySel.add(id);
  else { traySel.clear(); traySel.add(id); }
  lastTray = id; markTray();
});
$('#trayGrid').addEventListener('dblclick', e => { const t = e.target.closest('.th'); if (t) sendToModule([photos.find(p => p.id === t.dataset.id)]); });
$('#trayGrid').addEventListener('dragstart', e => { const t = e.target.closest('.th'); if (!t) return; if (!traySel.has(t.dataset.id)){ traySel.clear(); traySel.add(t.dataset.id); markTray(); } e.dataTransfer.setData('text/x-hanai-photo', [...traySel].join(',')); e.dataTransfer.effectAllowed = 'copy'; });
$('#trayGrid').addEventListener('contextmenu', e => {
  e.preventDefault(); const t = e.target.closest('.th'); if (t && !traySel.has(t.dataset.id)){ traySel.clear(); traySel.add(t.dataset.id); markTray(); }
  const sp = selPhotos();
  Moa.menu(e.clientX, e.clientY, [
    {label:'사진 편집으로 열기', disabled:sp.length !== 1, onClick:() => { showMod('edit'); edOpenPhoto(sp[0]); }},
    {label:'일괄 편집에 넣기', disabled:!sp.length, onClick:() => { showMod('batch'); batchAdd(sp); }},
    {label:'페이지에 넣기', disabled:!sp.length, onClick:() => { showMod('page'); pageFill(sp); }},
    {label:'이어 붙이기에 넣기', disabled:!sp.length, onClick:() => { showMod('join'); joinAdd(sp); }},
    {label:'GIF에 넣기', disabled:!sp.length, onClick:() => { showMod('gif'); gifAdd(sp); }},
    {label:'인쇄에 넣기', disabled:!sp.length, onClick:() => { showMod('print'); printAdd(sp); }},
    '-', {label:'모두 선택', onClick:() => { photos.forEach(p => traySel.add(p.id)); markTray(); }},
    {label:'서랍에서 빼기', disabled:!sp.length, onClick:() => { photos = photos.filter(p => !traySel.has(p.id)); traySel.clear(); renderTray(); }}]);
});
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea,select')) return; if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.tray') && e.key === 'Delete'){ photos = photos.filter(p => !traySel.has(p.id)); traySel.clear(); renderTray(); } });
async function openFiles(){
  if (window.showOpenFilePicker){
    try { const hs = await showOpenFilePicker({multiple:true, id:'hanai-photo', types:[{description:'사진', accept:{'image/*':['.jpg','.jpeg','.png','.gif','.webp','.bmp','.avif','.heic','.heif']}}]}); const l = []; for (const h of hs) l.push({file:await h.getFile(), handle:h}); return addPhotos(l, {select:true}); }
    catch(e){ if (e.name === 'AbortError') return []; }
  }
  const fs = await Moa.pickFiles({accept:'image/*,.heic,.heif', multiple:true}); return addPhotos(fs, {select:true});
}
async function walk(dh, out, depth=0){ for await (const [n, h] of dh.entries()){ if (h.kind === 'file' && IMG_RE.test(n)) out.push({file:await h.getFile(), handle:h, dir:dh}); else if (h.kind === 'directory' && depth < 3) await walk(h, out, depth + 1); } }
async function openFolder(){
  if (window.showDirectoryPicker){
    try { const dh = await showDirectoryPicker({id:'hanai-photo-dir'}); const out = []; await walk(dh, out); out.sort((a, b) => a.file.name.localeCompare(b.file.name, 'ko', {numeric:true})); return addPhotos(out); }
    catch(e){ if (e.name === 'AbortError') return []; }
  }
  const fs = await Moa.pickFiles({directory:true}); return addPhotos(fs);
}
Moa.enableDrop(fs => { addPhotos(fs, {select:true}).then(a => { if (a.length === 1 && cur === 'edit') edOpenPhoto(a[0]); else if (a.length) toast(a.length + '장을 사진 서랍에 넣었습니다'); }); }, '사진·폴더를 놓으세요');
document.addEventListener('paste', async e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if (!it) return;
  const f = it.getAsFile(); const nf = new File([f], '붙여넣은 그림 ' + Moa.fmtDate(Date.now()).replace(/[: ]/g, '-') + '.png', {type:f.type});
  const a = await addPhotos([nf], {select:true}); if (a.length && cur === 'edit') edOpenPhoto(a[0]);
});
function buildTray(){
  const b = $('#trayBar'); b.innerHTML = '';
  const B = (ic, t, fn) => el('button', {class:'ibtn', title:t, html:icon(ic), onclick:fn});
  b.append(B('open', '사진 열기', openFiles), B('folder', '폴더 열기', openFolder), B('check', '모두 선택', () => { photos.forEach(p => traySel.add(p.id)); markTray(); }), B('minus', '선택한 사진 빼기', () => { photos = photos.filter(p => !traySel.has(p.id)); traySel.clear(); renderTray(); }), el('span', {class:'grow'}), el('span', {class:'dim', style:{fontSize:'11px'}}, '사진 서랍'));
  renderTray();
}

/* ===================== 모듈 ===================== */
const MODS = [
  ['home', '홈', 'home'], ['edit', '사진 편집', 'edit'], ['batch', '일괄 편집', 'pages'], ['page', '페이지', 'grid'], ['join', '이어 붙이기', 'merge'],
  ['gif', 'GIF 만들기', 'image'], ['print', '인쇄', 'print'], ['split', '분할', 'split'], ['color', '색 추출', 'dropper'], ['rename', '이름 바꾸기', 'tag']];
let cur = 'home';
const modInit = {}, modShow = {};
function showMod(m){
  cur = m; S.lastMod = m; saveS();
  $$('.mod').forEach(x => x.classList.toggle('on', x.id === 'm-' + m));
  $$('#modtabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  if (modInit[m] && !modInit[m].done){ modInit[m](); modInit[m].done = true; }
  modShow[m] && modShow[m]();
}
function buildTabs(){ const t = $('#modtabs'); MODS.forEach(([k, n, ic]) => t.append(el('button', {'data-m':k, html:icon(ic) + n, onclick:() => showMod(k)}))); }
function sendToModule(ps){
  if (!ps.length) return;

/* ===================== 이미지 처리 ===================== */
function applyCssFilter(c, filter, mix=1){

}
function pixelOp(c, fn, mix=1){

}
const lum = (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b;
function blurred(c, rad){ const t = newCanvas(c.width, c.height), g = t.getContext('2d'); g.filter = `blur(${rad}px)`; g.drawImage(c, 0, 0); return t; }

function curve(c, f, mix=1){ const lut = new Uint8ClampedArray(256); for (let i = 0; i < 256; i++) lut[i] = f(i / 255) * 255; return pixelOp(c, (r, g, b) => [lut[r], lut[g], lut[b]], mix); }

  '세피아':(c, m) => applyCssFilter(c, 'sepia(1)', m),

  '빛바램':(c, m) => { curve(c, x => .12 + x * .78, m); return applyCssFilter(c, 'saturate(.7)', m); },

  '크로스':(c, m) => pixelOp(c, (r, g, b) => { const s = x => 255 / (1 + Math.exp(-(x / 255 - .5) * 7)); return [s(r), s(g) * .95 + 8, b * .7 + 40]; }, m),

  const rows = [['Ctrl+O', '사진 열기'], ['Ctrl+V', '그림 붙여넣기 (서랍에 들어감)'], ['Ctrl+S', '(편집) 저장'], ['Ctrl+Z / Ctrl+Y', '(편집) 실행 취소 / 다시 실행'], ['Ctrl+Shift+C', '(편집) 클립보드로 복사'], ['T', '(편집) 글자 넣기'], ['Delete', '(편집) 선택한 사물 삭제 / (서랍) 사진 빼기'], ['Ctrl+D', '(편집) 사물 복제'], ['방향키', '(편집) 사물 1px 이동 (Shift: 10px)'], ['[ / ]', '(편집) 붓 크기'], ['Space+끌기', '(편집) 화면 이동'], ['휠', '(편집) 확대·축소'], ['0 / 1', '(편집) 화면 맞춤 / 100%'], ['+ / -', '(편집) 확대 / 축소'], ['PageUp / PageDown', '(편집) 서랍의 이전 / 다음 사진'], ['Enter / Esc', '(자르기) 적용 / 취소'], ['F1', '도움말']];
  const body = el('div', {style:{width:'min(640px,90vw)'}, html:`<div style="line-height:1.8;margin-bottom:10px"><b>사용 순서</b>: 왼쪽 <b>사진 서랍</b>에 사진을 넣고(끌어다 놓기·열기·붙여넣기) 위쪽 탭에서 할 일을 고릅니다. 서랍 사진을 더블클릭하면 지금 화면에 들어가고, 오른쪽 클릭으로 다른 기능에 보낼 수 있습니다.<br>
· <b>사진 편집</b>: 홈(액자 ${Object.keys(FRAMES).length - 1}종·자동 보정·밝기·색·필터 ${Object.keys(FILTERS).length}종·크기·회전) / 사물(글자·말풍선·도형·스티커·아이콘·사진 넣기) / 자르기(비율·원형) / 도구(적목·잡티·복제 도장·모자이크·흐림·흑백·지우개·마법봉)<br>
· <b>일괄 편집</b>·<b>페이지</b>(${TEMPLATES.length}가지 틀)·<b>이어 붙이기</b>·<b>GIF</b>·<b>인쇄</b>(증명사진·PDF)·<b>분할</b>·<b>색 추출</b>·<b>이름 바꾸기</b><br>
· 지원 형식: JPG·PNG·GIF·WebP·BMP·AVIF${PLUS ? '·HEIC(Plus)' : ''}. 휴대폰 사진의 회전 정보(EXIF)는 자동으로 반영합니다.</div>` + Moa.shortcutTable(rows)});
  Moa.modal({title:'HANAI Photo 도움말', body});
}
function init(){
  buildTabs(); buildTray();
  $('#bSkin').onclick = e => Moa.themeMenu('photo', e.clientX - 120, e.clientY + 14);
  $('#bHelp').onclick = helpDialog;
  if (PLUS) $('#subTitle').innerHTML = 'HANAI Tools 사진 꾸미기 <b style="color:var(--accent)">Plus</b>';
  showMod(MODS.some(x => x[0] === S.lastMod) ? S.lastMod : 'home');
  window.HanaiPhoto = {S, get photos(){ return photos; }, traySel, addPhotos, showMod, get cur(){ return cur; }, ed, edOpenPhoto, edOpenCanvas, edApply, edDrawNow, flatten, addText, addBalloon, addEmoji, addIcon, addShape, addImageObj, objMerge, cropStart, cropApply, autoTrim, magicErase, redEye, FILTERS, FRAMES, applyFrame, adjust, backlight, autoContrast, bt, batchAdd, batchProcess, batchRun, pg, pageFill, pageRender, TEMPLATES, jn, joinAdd, joinRender, gf, gifAdd, gifFrames, gifSave, pr, printAdd, printLayout, printPages, makePDF, sp, splitOpen, splitRects, splitSave, co, colorOpen, colorPick, paletteOf, rn, renameAddPhotos, renameApply, renameDo, renamePreview, makeZip, canvasBlob, getCanvas, edUndo, edRedo, rotateFree, edSetTab, get edPanelEl(){ return $('#edPanel'); }};
}
init();
})();

<script>/* 웹판: 처음 화면 · 기본판 ↔ Plus판 전환 */
(function(){
  var plus = /\/plus\//.test(location.pathname), f = location.pathname.split('/').pop() || 'index.html';
  var t = document.querySelector('.moa-title'); if (!t) return;
  function b(txt, href, title, ask){ var a = document.createElement('a'); a.className = 'btn sm'; a.textContent = txt; a.href = href; a.title = title; a.style.marginLeft = '6px'; a.style.textDecoration = 'none';
    if (ask) a.onclick = function(e){ if (!confirm('지금 열려 있는 파일과 작업은 닫힙니다.\n' + (plus ? '기본판' : 'Plus판') + '으로 바꿀까요?')) e.preventDefault(); };
    t.appendChild(a); }
  b('처음 화면', './', 'HANAI Tools 처음 화면', true);
  b(plus ? '기본판으로' : 'Plus판으로', (plus ? '../' : 'plus/') + f, plus ? '같은 프로그램의 기본판을 엽니다' : '같은 프로그램의 Plus판을 엽니다 (7Z·음정·MP3·글자 추출·AI 배경 지우기 등)', true);
})();
</script>
