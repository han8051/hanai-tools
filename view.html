<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%237c8cff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANAI View - HANAI Tools 이미지 뷰어</title>
<link rel="stylesheet" href="lib/moa.css">
<style>
.body{flex:1;display:grid;grid-template-columns:220px 1fr 280px;min-height:0}
@media (max-width:1100px){.body{grid-template-columns:200px 1fr}.info{display:none}}
@media (max-width:700px){.body{grid-template-columns:1fr}.tree{display:none}}
.tree{border-right:1px solid var(--line);overflow:auto;padding:6px 0;background:var(--panel)}
.tree .node{display:flex;gap:6px;align-items:center;padding:4px 10px;cursor:pointer;white-space:nowrap;border-radius:6px;margin:0 4px}
.tree .node:hover{background:var(--hover)}
.tree .node.cur{background:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:700}
.tree .cnt{color:var(--dim);font-size:11px;margin-left:auto}
.center{display:flex;flex-direction:column;min-height:0}
.gbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.gbar input[type=search]{width:200px}
.grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--th,150px),1fr));gap:10px;align-content:start}
.thumb{border:2px solid transparent;border-radius:10px;background:var(--panel);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;user-select:none}
.thumb:hover{border-color:var(--line)}
.thumb.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.thumb .im{aspect-ratio:1;display:grid;place-items:center;background:var(--bg2);border-radius:6px;overflow:hidden}
.thumb .im img{max-width:100%;max-height:100%;object-fit:contain}
.thumb .nm{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.thumb .sz{font-size:10.5px;color:var(--dim);text-align:center}
.info{border-left:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel)}
.info img{width:100%;max-height:200px;object-fit:contain;background:var(--bg2);border-radius:8px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;font-size:12px;margin-top:8px}
.kv dt{color:var(--dim)}.kv dd{margin:0;word-break:break-all}
#hist{width:100%;height:80px;background:var(--bg2);border-radius:6px;margin-top:10px}
/* 뷰어 */
.viewer{position:fixed;inset:0;background:#0a0b10;z-index:500;display:flex;flex-direction:column;color:#e8eaf2}
.viewer.light{background:#eceef3;color:#222}
.vbar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:rgba(20,22,32,.92);flex:none;transition:opacity .25s}
.viewer.light .vbar{background:rgba(255,255,255,.95)}
.vbar .ibtn{color:inherit}
.vbar .ttl{font-weight:700;margin:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.vbar .dim{color:#9aa0b8}
.vstage{flex:1;position:relative;overflow:hidden;cursor:grab}
.vstage.drag{cursor:grabbing}
.vstage img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;image-rendering:auto}
.vstage img.pixel{image-rendering:pixelated}
.vstage img.fade{transition:opacity .6s}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:100px;border:0;background:rgba(0,0,0,.25);color:#fff;font-size:30px;cursor:pointer;opacity:0;transition:.2s;border-radius:8px}
.vstage:hover .vnav{opacity:.8}
.vnav.l{left:10px}.vnav.r{right:10px}
.film{display:flex;gap:4px;overflow-x:auto;padding:6px;background:rgba(20,22,32,.92);flex:none}
.viewer.light .film{background:rgba(255,255,255,.95)}
.film img{height:56px;width:56px;object-fit:cover;border-radius:4px;opacity:.55;cursor:pointer;border:2px solid transparent;flex:none}
.film img.cur{opacity:1;border-color:var(--accent)}
.vinfo{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;max-width:300px;pointer-events:none}
.vinfo dl{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;margin:0}.vinfo dt{opacity:.65}.vinfo dd{margin:0}
.viewer.slideshow .vbar,.viewer.slideshow .film{opacity:0}
.viewer.slideshow:hover .vbar{opacity:1}
.zoomtag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;pointer-events:none;opacity:0;transition:.3s}
/* 편집기 */
.editor{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column}
.ebody{flex:1;display:grid;grid-template-columns:64px 1fr 270px;min-height:0}
.etools{display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.etools .tb{min-width:0;padding:6px 2px;font-size:10px}
.estage{position:relative;overflow:auto;background:repeating-conic-gradient(#8882 0% 25%,transparent 0% 50%) 0 0/20px 20px;display:grid;place-items:center}
.estage canvas{box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:none}
.eopts{background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
.eopts h3{margin:0 0 10px;font-size:14px}
.eopts .row{margin:8px 0}
.eopts label.sl{display:grid;grid-template-columns:80px 1fr 40px;align-items:center;gap:6px;margin:8px 0}
.eopts .val{font-size:11px;color:var(--dim);text-align:right}
.eopts label.sl input{min-width:0;width:100%}
.eopts label.sl{grid-template-columns:72px minmax(0,1fr) 38px}
.overlay{position:absolute;pointer-events:none}
.cropbox{position:absolute;border:1px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);outline:1px solid #000;pointer-events:none}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="moa-app" id="app">
  <div class="moa-title"><div class="moa-logo">C</div><h1>HANAI View</h1><span class="sub">HANAI Tools 이미지 뷰어</span><span class="grow"></span><span class="sub" id="rootName"></span></div>
  <div class="moa-toolbar" id="toolbar"></div>
  <div class="body">
    <div class="tree" id="tree"></div>
    <div class="center">
      <div class="gbar">
        <button class="btn sm" id="bSort">정렬: 이름 ▾</button>
        <span class="dim">크기</span><input type="range" id="thSize" min="90" max="320" value="150" style="width:110px">
        <span class="grow"></span>
        <input type="search" id="search" placeholder="파일 이름 찾기">
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="info" id="info"></div>
  </div>
  <div class="moa-status"><span class="grow" id="status">준비</span><span id="stSel"></span><span id="stCount"></span></div>
</div>
<script src="lib/pako.min.js"></script>
<script src="lib/moa-common.js"></script>
<script src="lib/moa-zip.js"></script>
<script src="lib/moa-img.js"></script>
<script>
(() => {
'use strict';
const {$, el, esc, toast, icon} = Moa;
Moa.applyTheme('see');
const S = Object.assign({sort:'name', sortD:1, th:150, slideSec:3, slideFx:'fade', slideLoop:true, viewerBg:'dark', fitMode:'fit', quality:0.92}, Moa.store.get('moasee.settings', {}));
const saveS = () => Moa.store.set('moasee.settings', S);
const IMG_RE = /\.(jpe?g|png|gif|webp|bmp|avif|svg|ico|jfif|apng)$/i;

/* 상태 */
let all = [];          // {id, name, path, dir, file, handle, dirHandle, size, mtime, w, h, thumb, url, exif}
let dirs = new Map();  // path -> {name, handle}
let curDir = null;     // null = 전체
let shown = [];
let selected = new Set(), lastSel = null, focusId = null;
let rootHandle = null;
let uid = 0;

Moa.toolbar($('#toolbar'), [
  {icon:'folder', label:'폴더 열기', title:'사진 폴더 열기 (Ctrl+Shift+O)', onClick:()=>openFolder()},
  {icon:'open', label:'파일 열기', title:'사진 파일 열기 (Ctrl+O)', onClick:()=>openFiles()},
  {icon:'copy', label:'붙여넣기', title:'클립보드의 그림 열기 (Ctrl+V)', onClick:()=>pasteClipboard()},
  '|',
  {icon:'eye', label:'보기', title:'크게 보기 (Enter)', onClick:()=>openViewer()},
  {icon:'slideshow', label:'슬라이드 쇼', title:'슬라이드 쇼 (F5)', onClick:()=>openViewer(null, true)},
  {icon:'edit', label:'편집', title:'사진 편집 (E)', onClick:()=>openEditor()},
  '|',
  {icon:'rotL', label:'왼쪽 회전', title:'왼쪽으로 90° 회전해 저장 (Ctrl+L)', onClick:()=>quickRotate(-90)},
  {icon:'rotR', label:'오른쪽 회전', title:'오른쪽으로 90° 회전해 저장 (Ctrl+R)', onClick:()=>quickRotate(90)},
  {icon:'convert', label:'일괄 변환', title:'형식·크기·이름 한 번에 바꾸기', onClick:()=>batchDialog()},
  {icon:'grid', label:'사진 합치기', title:'여러 사진을 한 장으로', onClick:()=>combineDialog()},
  {icon:'image', label:'GIF 만들기', title:'움직이는 GIF 만들기', onClick:()=>gifDialog()},
  '|',
  {icon:'edit', label:'이름 바꾸기', title:'이름 바꾸기 (F2)', onClick:()=>renameSel()},
  {icon:'trash', label:'삭제', title:'목록에서 빼기 / 파일 삭제 (Delete)', onClick:()=>deleteSel()},
  {icon:'copy', label:'복사', title:'그림을 클립보드로 복사 (Ctrl+C)', onClick:()=>copySel()},
  {icon:'print', label:'인쇄', title:'인쇄 (Ctrl+P)', onClick:()=>printSel()},
  '|',
  {icon:'palette', label:'스킨', onClick:e=>Moa.themeMenu('see', e.clientX, e.clientY+10)},
  {icon:'gear', label:'설정', onClick:()=>settings()},
  {icon:'help', label:'도움말', onClick:()=>help()},
]);

/* ================= 파일 불러오기 ================= */
async function openFolder(){
  if (window.showDirectoryPicker){
    try {
      const h = await showDirectoryPicker({mode:'readwrite', id:'moasee'});
      rootHandle = h; await loadFromHandle(h); return;
    } catch(e){ if (e.name === 'AbortError') return; console.warn(e); }
  }
  const fs = await Moa.pickFiles({directory:true}); if (fs.length){ rootHandle = null; addFiles(fs, true); }
}
async function openFiles(){ const fs = await Moa.pickFiles({accept:'image/*'}); if (fs.length) addFiles(fs, false); }
async function loadFromHandle(root){
  all = []; dirs = new Map(); selected.clear(); setStatus('폴더를 읽는 중…');
  $('#rootName').textContent = root.name;
  const walk = async (h, path, depth) => {
    dirs.set(path, {name: h.name, handle: h});
    const subs = [];
    for await (const [name, e] of h.entries()){
      if (e.kind === 'file' && IMG_RE.test(name)){ const f = await e.getFile(); all.push(mkItem(f, path, e, h)); }
      else if (e.kind === 'directory' && depth < 6 && !name.startsWith('.')) subs.push([e, path + name + '/']);
    }
    for (const [e, p] of subs) await walk(e, p, depth + 1);
  };
  await walk(root, root.name + '/', 0);
  curDir = root.name + '/';
  afterLoad();
}
function mkItem(f, dir, handle, dirHandle){ return {id: ++uid, name: f.name, path: dir + f.name, dir, file: f, handle, dirHandle, size: f.size, mtime: f.lastModified, w:0, h:0}; }
function addFiles(files, asFolder){
  const imgs = files.filter(f => IMG_RE.test(f.name) || (f.type || '').startsWith('image/'));
  if (!imgs.length) return toast('그림 파일이 없습니다');
  if (asFolder){ all = []; dirs = new Map(); selected.clear(); }
  for (const f of imgs){
    const rel = (f.relPath || f.webkitRelativePath || f.name).replace(/\\/g, '/');
    const dir = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/') + 1) : '열린 파일/';
    let p = ''; dir.split('/').filter(Boolean).forEach(part => { p += part + '/'; if (!dirs.has(p)) dirs.set(p, {name: part}); });
    if (!all.some(x => x.path === dir + f.name && x.size === f.size)) all.push(mkItem(f, dir, null, null));
  }
  const firstDir = all[all.length - 1].dir;
  if (asFolder) $('#rootName').textContent = [...dirs.keys()][0]?.replace(/\/$/, '') || '';
  curDir = asFolder ? [...dirs.keys()][0] : firstDir;
  afterLoad();
  if (!asFolder && imgs.length === 1){ const it = all.find(x => x.file === imgs[0]); if (it) openViewer(it); }
}
function afterLoad(){ renderTree(); renderGrid(); setStatus(`사진 ${all.length}장`); }
async function pasteClipboard(){
  try {
    const items = await navigator.clipboard.read();
    for (const it of items){ const t = it.types.find(x => x.startsWith('image/')); if (t){ const b = await it.getType(t); addFiles([new File([b], '붙여넣은 그림 ' + new Date().toLocaleTimeString('ko-KR').replace(/:/g,'-') + '.png', {type:b.type})], false); return; } }
    toast('클립보드에 그림이 없습니다');
  } catch(e){ toast('Ctrl+V로 붙여넣어 주세요'); }
}
document.addEventListener('paste', e => {
  if (document.querySelector('.editor,.moa-modal-bg')) return;
  const f = [...(e.clipboardData?.files || [])].filter(x => x.type.startsWith('image/'));
  if (f.length){ e.preventDefault(); addFiles(f.map(x => new File([x], x.name === 'image.png' ? '붙여넣은 그림.png' : x.name, {type:x.type})), false); }
});
Moa.enableDrop(fs => addFiles(fs, fs.some(f => (f.relPath||'').includes('/'))), '사진 파일이나 폴더를 놓으세요');

/* ================= 트리 / 그리드 ================= */
function renderTree(){
  const t = $('#tree'); t.innerHTML = '';
  const cnt = p => all.filter(x => x.dir.startsWith(p)).length;
  t.append(el('div',{class:'node' + (curDir === null ? ' cur' : ''), onclick:()=>{ curDir = null; renderTree(); renderGrid(); }}, '🗂 모든 사진', el('span',{class:'cnt'}, all.length)));
  [...dirs.keys()].sort((a,b) => a.localeCompare(b, 'ko', {numeric:true})).forEach(p => {
    const depth = p.split('/').length - 2; const n = cnt(p); if (!n) return;
    t.append(el('div',{class:'node' + (curDir === p ? ' cur' : ''), style:{paddingLeft:(10 + depth*14) + 'px'}, title:p, onclick:()=>{ curDir = p; renderTree(); renderGrid(); }}, '📁 ' + dirs.get(p).name, el('span',{class:'cnt'}, n)));
  });
}
let filterText = '';
function computeShown(){
  let list = curDir === null ? all.slice() : all.filter(x => x.dir === curDir);
  if (filterText) list = list.filter(x => x.name.toLowerCase().includes(filterText.toLowerCase()));
  const k = S.sort, d = S.sortD;
  const v = x => k === 'name' ? x.name : k === 'date' ? x.mtime : k === 'size' ? x.size : k === 'type' ? x.name.split('.').pop().toLowerCase() + x.name : k === 'dim' ? x.w * x.h : x.name;
  list.sort((a, b) => { const p = v(a), q = v(b); return (typeof p === 'number' ? p - q : String(p).localeCompare(String(q), 'ko', {numeric:true})) * d; });
  shown = list;
}
const SORTS = {name:'이름', date:'날짜', size:'파일 크기', type:'종류', dim:'해상도'};
function renderGrid(){
  computeShown();
  $('#bSort').textContent = `정렬: ${SORTS[S.sort]} ${S.sortD > 0 ? '↑' : '↓'} ▾`;
  const g = $('#grid'); g.innerHTML = ''; g.style.setProperty('--th', S.th + 'px'); $('#thSize').value = S.th;
  if (!all.length){
    g.append(el('div',{class:'empty-state', style:{gridColumn:'1/-1'}, html:`<svg viewBox="0 0 24 24">${Moa.icons.image}</svg><div>사진 폴더나 파일을 이 창에 끌어다 놓거나<br><b>폴더 열기</b>를 누르세요.<br><span style="font-size:11px">JPG · PNG · GIF · WEBP · BMP · AVIF · SVG 지원 · 폴더를 열면 편집 후 바로 저장할 수 있습니다</span></div>`},
      el('div',{class:'row'}, el('button',{class:'btn primary', onclick:openFolder}, '폴더 열기'), el('button',{class:'btn', onclick:openFiles}, '파일 열기'))));
  }
  const frag = document.createDocumentFragment();
  for (const it of shown){
    const d = el('div',{class:'thumb' + (selected.has(it.id) ? ' sel' : ''), title:it.path});
    d.dataset.id = it.id;
    d.innerHTML = `<div class="im">${it.thumb ? `<img src="${it.thumb}" alt="">` : '<span class="dim">…</span>'}</div><div class="nm">${esc(it.name)}</div><div class="sz">${it.w ? it.w + '×' + it.h + ' · ' : ''}${Moa.fmtBytes(it.size)}</div>`;
    frag.append(d);
  }
  g.append(frag);
  $('#stCount').textContent = `${shown.length}장` + (curDir ? ' · ' + curDir.replace(/\/$/, '') : '');
  observeThumbs(); updateSel();
}
let io;
function observeThumbs(){
  if (io) io.disconnect();
  io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting){ const it = byId(+en.target.dataset.id); if (it && !it.thumb && !it.thumbing) queueThumb(it); io.unobserve(en.target); } }), {root:$('#grid'), rootMargin:'300px'});
  $('#grid').querySelectorAll('.thumb').forEach(t => io.observe(t));
}
const byId = id => all.find(x => x.id === id);
const tq = []; let tActive = 0;
function queueThumb(it){ it.thumbing = true; tq.push(it); pumpThumb(); }
function pumpThumb(){
  while (tActive < 4 && tq.length){
    const it = tq.shift(); tActive++;
    makeThumb(it).catch(() => { it.thumb = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><text x="5" y="6" font-size="2" text-anchor="middle" fill="#888">열 수 없음</text></svg>'); })
      .finally(() => { tActive--; const d = $('#grid').querySelector(`.thumb[data-id="${it.id}"]`); if (d){ d.querySelector('.im').innerHTML = `<img src="${it.thumb}" alt="">`; d.querySelector('.sz').textContent = (it.w ? it.w + '×' + it.h + ' · ' : '') + Moa.fmtBytes(it.size); } if (focusId === it.id) renderInfo(); pumpThumb(); });
  }
}
async function makeThumb(it){
  const img = await Moa.loadImage(URL.createObjectURL(it.file));
  it.w = img.naturalWidth; it.h = img.naturalHeight;
  const s = Math.min(1, 320 / Math.max(it.w, it.h));
  const c = MoaImg.resizeCanvas(MoaImg.canvasFrom(img), Math.max(1, it.w * s), Math.max(1, it.h * s));
  URL.revokeObjectURL(img.src);
  it.thumbCanvas = c;
  it.thumb = URL.createObjectURL(await Moa.canvasToBlob(c, 'image/jpeg', .85));
}
$('#thSize').oninput = e => { S.th = +e.target.value; $('#grid').style.setProperty('--th', S.th + 'px'); saveS(); };
$('#search').oninput = e => { filterText = e.target.value.trim(); renderGrid(); };
$('#bSort').onclick = e => Moa.menu(e.clientX, e.clientY + 10, Object.entries(SORTS).map(([k, v]) => ({label:(S.sort === k ? '● ' : '') + v, onClick:()=>{ S.sortD = S.sort === k ? -S.sortD : 1; S.sort = k; saveS(); renderGrid(); }})).concat(['-', {label:'오름/내림 바꾸기', onClick:()=>{ S.sortD = -S.sortD; saveS(); renderGrid(); }}]));
$('#grid').addEventListener('click', e => {
  const d = e.target.closest('.thumb'); if (!d){ selected.clear(); updateSel(); return; }
  const id = +d.dataset.id, ids = shown.map(x => x.id);
  if (e.shiftKey && lastSel){ const a = ids.indexOf(lastSel), b = ids.indexOf(id); if (!e.ctrlKey) selected.clear(); for (let i = Math.min(a,b); i <= Math.max(a,b); i++) selected.add(ids[i]); }
  else if (e.ctrlKey || e.metaKey){ selected.has(id) ? selected.delete(id) : selected.add(id); lastSel = id; }
  else { selected.clear(); selected.add(id); lastSel = id; }
  focusId = id; updateSel(); renderInfo();
});
$('#grid').addEventListener('dblclick', e => { const d = e.target.closest('.thumb'); if (d) openViewer(byId(+d.dataset.id)); });
$('#grid').addEventListener('contextmenu', e => {
  const d = e.target.closest('.thumb'); if (!d) return; e.preventDefault();
  const id = +d.dataset.id; if (!selected.has(id)){ selected.clear(); selected.add(id); lastSel = id; focusId = id; updateSel(); renderInfo(); }
  Moa.menu(e.clientX, e.clientY, [
    {label:'크게 보기', hint:'Enter', onClick:()=>openViewer(byId(id))}, {label:'편집', hint:'E', onClick:()=>openEditor(byId(id))},
    {label:'슬라이드 쇼', hint:'F5', onClick:()=>openViewer(byId(id), true)},
    '-', {label:'왼쪽으로 회전', onClick:()=>quickRotate(-90)}, {label:'오른쪽으로 회전', onClick:()=>quickRotate(90)},

async function combineDialog(){
  const sel = selItems(); if (sel.length < 2) return toast('합칠 사진을 2장 이상 선택하세요 (Ctrl/Shift+클릭)');
  const imgs = []; for (const it of sel){ imgs.push(await Moa.loadImage(URL.createObjectURL(it.file))); }
  const o = {dir:'h', cols:2, gap:10, bg:'#ffffff', size:1200, fit:'match'};
  const pv = el('canvas',{style:{maxWidth:'100%', maxHeight:'50vh', display:'block', margin:'10px auto', background:'repeating-conic-gradient(#8883 0% 25%,transparent 0% 50%) 0 0/16px 16px'}});
  const build = () => {
    let c = document.createElement('canvas'), g;
    if (o.dir === 'grid'){
      const cols = Math.max(1, o.cols), rows = Math.ceil(imgs.length / cols), cell = Math.round(o.size / cols);
      c.width = cols * cell + (cols + 1) * o.gap; c.height = rows * cell + (rows + 1) * o.gap; g = c.getContext('2d'); g.fillStyle = o.bg; g.fillRect(0, 0, c.width, c.height);
      imgs.forEach((im, i) => { const x = o.gap + (i % cols) * (cell + o.gap), y = o.gap + Math.floor(i / cols) * (cell + o.gap); const s = Math.max(cell / im.naturalWidth, cell / im.naturalHeight); const w = im.naturalWidth * s, h = im.naturalHeight * s; g.save(); g.beginPath(); g.rect(x, y, cell, cell); g.clip(); g.drawImage(im, x + (cell - w) / 2, y + (cell - h) / 2, w, h); g.restore(); });
    } else {
      const H = o.dir === 'h';
      const base = o.size; // 가로 합치기: 같은 높이, 세로 합치기: 같은 너비
      const sizes = imgs.map(im => H ? [im.naturalWidth * base / im.naturalHeight, base] : [base, im.naturalHeight * base / im.naturalWidth]);
      c.width = H ? sizes.reduce((a, s) => a + s[0], 0) + o.gap * (imgs.length + 1) : base + o.gap * 2;
      c.height = H ? base + o.gap * 2 : sizes.reduce((a, s) => a + s[1], 0) + o.gap * (imgs.length + 1);
      if (c.width > 16000 || c.height > 16000){ const k = 16000 / Math.max(c.width, c.height); o.size = Math.floor(o.size * k); return build(); }
      g = c.getContext('2d'); g.fillStyle = o.bg; g.fillRect(0, 0, c.width, c.height);
      let p = o.gap; imgs.forEach((im, i) => { const [w, h] = sizes[i]; if (H){ g.drawImage(im, p, o.gap, w, h); p += w + o.gap; } else { g.drawImage(im, o.gap, p, w, h); p += h + o.gap; } });
    }
    return c;
  };
  const upd = () => { const c = build(); pv.width = c.width; pv.height = c.height; pv.getContext('2d').drawImage(c, 0, 0); info.textContent = `${c.width} × ${c.height} 픽셀`; };
  const info = el('div',{class:'dim', style:{textAlign:'center'}});
  const body = el('div',{style:{width:'min(720px,90vw)'}},
    el('div',{class:'row', style:{flexWrap:'wrap'}}, ...[['h','가로로 이어 붙이기'],['v','세로로 이어 붙이기'],['grid','바둑판']].map(([v, n], i) => el('label',{class:'chk'}, el('input',{type:'radio', name:'cd', checked:i===0, onchange:()=>{ o.dir = v; upd(); }}), n))),
    el('div',{class:'row', style:{flexWrap:'wrap', marginTop:'8px'}}, '간격', el('input',{type:'number', value:o.gap, min:0, max:200, style:{width:'70px'}, oninput:e => { o.gap = +e.target.value; upd(); }}),
      '기준 크기', el('input',{type:'number', value:o.size, min:100, max:8000, style:{width:'90px'}, oninput:e => { o.size = +e.target.value; upd(); }}),
      '열 수(바둑판)', el('input',{type:'number', value:o.cols, min:1, max:10, style:{width:'60px'}, oninput:e => { o.cols = +e.target.value; upd(); }}),
      '배경', el('input',{type:'color', value:o.bg, oninput:e => { o.bg = e.target.value; upd(); }})),
    pv, info);
  upd();
  const r = await Moa.modal({title:`사진 합치기 (${imgs.length}장)`, body, width:'auto', buttons:[{label:'취소', value:null}, {label:'편집기로 열기', value:'edit'}, {label:'저장', primary:true, value:'save'}]});
  imgs.forEach(im => URL.revokeObjectURL(im.src));
  if (!r) return;
  const c = build(); const blob = await Moa.canvasToBlob(c, 'image/jpeg', S.quality);
  const f = new File([blob], '합친 사진.jpg', {type:'image/jpeg', lastModified:Date.now()});
  if (r === 'save'){ await Moa.saveAs(blob, '합친 사진.jpg'); }
  const it = mkItem(f, '만든 사진/', null, null); if (!dirs.has('만든 사진/')) dirs.set('만든 사진/', {name:'만든 사진'}); all.push(it); renderTree(); renderGrid();
  if (r === 'edit') openEditor(it);
}

  const imgs = []; for (const it of sel) imgs.push(await Moa.loadImage(URL.createObjectURL(it.file)));
  const o = {w:480, delay:500, loop:true, dither:true, fit:'contain', bg:'#ffffff'};
  const body = el('div',{style:{width:'min(520px,88vw)'}});
  const prevImg = el('img',{style:{maxWidth:'100%', maxHeight:'40vh', display:'block', margin:'10px auto', borderRadius:'6px'}});
  const info = el('div',{class:'dim', style:{textAlign:'center'}});
  body.append(el('div',{class:'dim'}, `${imgs.length}장 · 선택한 순서대로 재생됩니다.`),
    el('label',{class:'field'}, el('span',null,'가로 크기(px)'), el('input',{type:'number', value:o.w, min:50, max:1200, oninput:e => o.w = +e.target.value})),
    el('label',{class:'field'}, el('span',null,'장면 간격(ms)'), el('input',{type:'number', value:o.delay, min:20, max:10000, step:50, oninput:e => o.delay = +e.target.value})),
    el('label',{class:'field'}, el('span',null,'맞추기'), el('select',{onchange:e => o.fit = e.target.value}, el('option',{value:'contain'}, '여백 두고 맞춤'), el('option',{value:'cover'}, '꽉 채우기(잘림)'))),
    el('label',{class:'field'}, el('span',null,'배경색'), el('input',{type:'color', value:o.bg, oninput:e => o.bg = e.target.value})),
    el('label',{class:'chk'}, el('input',{type:'checkbox', checked:true, onchange:e => o.loop = e.target.checked}), '무한 반복'), ' ',
    el('label',{class:'chk'}, el('input',{type:'checkbox', checked:true, onchange:e => o.dither = e.target.checked}), '디더링 (색 표현 부드럽게)'),
    prevImg, info);
  let blob = null;
  const make = async () => {
    const r0 = imgs[0].naturalHeight / imgs[0].naturalWidth; const W = Math.round(o.w), H = Math.round(o.w * r0);
    info.textContent = '만드는 중…'; await new Promise(r => setTimeout(r, 20));
    const frames = imgs.map(im => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.fillStyle = o.bg; g.fillRect(0, 0, W, H); const s = (o.fit === 'cover' ? Math.max : Math.min)(W / im.naturalWidth, H / im.naturalHeight); const w = im.naturalWidth * s, h = im.naturalHeight * s; g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); return {canvas:c, delay:o.delay}; });
    blob = MoaImg.encodeGIF(frames, {loop: o.loop ? 0 : 1, dither:o.dither});
    if (prevImg.src) URL.revokeObjectURL(prevImg.src); prevImg.src = URL.createObjectURL(blob);
    info.textContent = `${W} × ${H} · ${frames.length}장면 · ${Moa.fmtBytes(blob.size)}`;
  };
  const r = await Moa.modal({title:'GIF 만들기', body, width:'auto', buttons:[{label:'취소', value:null}, {label:'미리 보기', onClick:async ()=>{ await make(); return false; }}, {label:'저장', primary:true, onClick:async ()=>{ if (!blob) await make(); return 'save'; }}]});
  imgs.forEach(im => URL.revokeObjectURL(im.src));
  if (r === 'save' && blob){ await Moa.saveAs(blob, '움직이는 사진.gif'); const f = new File([blob], '움직이는 사진.gif', {type:'image/gif', lastModified:Date.now()}); if (!dirs.has('만든 사진/')) dirs.set('만든 사진/', {name:'만든 사진'}); all.push(mkItem(f, '만든 사진/', null, null)); renderTree(); renderGrid(); }
}

/* ================= 설정 / 도움말 ================= */
function settings(){
  const body = el('div',{style:{width:'min(460px,86vw)'}, html:`
    <fieldset><legend>보기</legend>
      <label class="field"><span>처음 보기 크기</span><select id="sFit"><option value="fit">화면에 맞춤</option><option value="shrink">큰 사진만 줄이기</option></select></label>
      <label class="field"><span>마우스 휠</span><select id="sWheel"><option value="zoom">확대/축소</option><option value="nav">이전/다음 사진</option></select></label>
      <label class="field"><span>보기 배경</span><select id="sBg"><option value="dark">어둡게</option><option value="light">밝게</option></select></label></fieldset>
    <fieldset><legend>슬라이드 쇼</legend>
      <label class="field"><span>넘김 간격(초)</span><input type="number" id="sSec" min="1" max="60" value="${S.slideSec}"></label>
      <label class="chk"><input type="checkbox" id="sLoop" ${S.slideLoop ? 'checked' : ''}> 끝나면 처음부터 반복</label></fieldset>
    <fieldset><legend>저장</legend>
      <label class="field"><span>JPG 품질</span><input type="number" id="sQ" min="40" max="100" value="${Math.round(S.quality*100)}"></label></fieldset>`});
  body.querySelector('#sFit').value = S.fitMode; body.querySelector('#sWheel').value = S.wheelNav ? 'nav' : 'zoom'; body.querySelector('#sBg').value = S.viewerBg;
  Moa.modal({title:'설정', body, width:'auto', buttons:[{label:'취소', value:null}, {label:'확인', primary:true, onClick:()=>{ S.fitMode = body.querySelector('#sFit').value; S.wheelNav = body.querySelector('#sWheel').value === 'nav'; S.viewerBg = body.querySelector('#sBg').value; S.slideSec = Math.max(1, +body.querySelector('#sSec').value || 3); S.slideLoop = body.querySelector('#sLoop').checked; S.quality = Math.max(.4, Math.min(1, (+body.querySelector('#sQ').value || 92) / 100)); saveS(); }}]});
}
function help(){
  Moa.modal({title:'HANAI View 도움말', width:600, body:`<p style="margin-top:0"><b>폴더 열기</b>로 사진 폴더를 열면 하위 폴더까지 모두 보이고, 편집·회전·이름 바꾸기 결과를 원본 폴더에 바로 저장할 수 있습니다(Chrome·Edge). 사진을 끌어다 놓거나 Ctrl+V로 붙여넣어도 됩니다.</p>
  <p><b>보기</b>: 더블클릭하면 크게 봅니다. 휠로 확대/축소, 끌어서 이동, 더블클릭으로 원본 크기/맞춤 전환. <b>편집</b>: 자르기·크기·회전·색 보정·효과·모자이크·글자·그리기·도형·테두리를 지원하고 실행 취소가 됩니다.</p>
  <p><b>일괄 변환</b>은 여러 장의 형식·크기·이름·워터마크를 한 번에 바꾸고, <b>사진 합치기</b>와 <b>GIF 만들기</b>는 선택한 여러 장으로 새 사진을 만듭니다.</p>` +
  Moa.shortcutTable([['Enter / 더블클릭','크게 보기'],['← → / Space','이전 / 다음 (보기 중)'],['+ / -','확대 / 축소'],['* / 0','화면에 맞춤'],['/ / 1','원본 크기'],['F / F11','전체 화면'],['F5','슬라이드 쇼'],['I','사진 정보'],['L / R','보기 회전'],['E','편집'],['Ctrl+Z / Ctrl+Y','실행 취소 / 다시 실행 (편집)'],['Ctrl+S','저장 (편집)'],['Ctrl+C','클립보드로 복사'],['Ctrl+V','붙여넣기'],['F2','이름 바꾸기'],['Delete','삭제'],['Ctrl+A','전체 선택'],['Esc','닫기']])});
}

/* ================= 단축키 ================= */
document.addEventListener('keydown', e => {
  if (document.querySelector('.moa-modal-bg')) return;
  if (e.target.matches('input,textarea,select')) return;
  const k = e.key, c = e.ctrlKey || e.metaKey;
  if (E){
    if (c && (k === 'z' || k === 'Z')){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (c && (k === 'y' || k === 'Y')){ e.preventDefault(); redo(); }
    else if (c && (k === 's' || k === 'S')){ e.preventDefault(); saveEdit(e.shiftKey); }
    else if (c && (k === 'c' || k === 'C')){ e.preventDefault(); copyCanvas(E.work); }
    else if (k === 'Escape') closeEditor();
    else if (k === 'Enter' && E.enter){ e.preventDefault(); E.enter(); }
    else if (k === '+' || k === '='){ setEZoom(E.zoom * 1.25); } else if (k === '-'){ setEZoom(E.zoom / 1.25); } else if (k === '0'){ fitE(); }
    return;
  }
  if (V){
    if (k === 'Escape'){ if (document.fullscreenElement) return; closeViewer(); }
    else if (k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown'){ e.preventDefault(); V.go(1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp' || k === 'Backspace'){ e.preventDefault(); V.go(-1); }
    else if (k === ' '){ e.preventDefault(); if (V.slide) V.toggleSlide(); else V.go(1); }
    else if (k === 'Home'){ V.i = 0; V.show(); } else if (k === 'End'){ V.i = V.list.length - 1; V.show(); }
    else if (k === '+' || k === '='){ V.zoomBy(1.25); } else if (k === '-'){ V.zoomBy(1/1.25); }
    else if (k === '*' || k === '0'){ V.fit(); } else if (k === '/' || k === '1'){ V.setZoom(1); }
    else if (k === 'f' || k === 'F' || k === 'F11' || k === 'Enter'){ e.preventDefault(); V.toggleFull(); }
    else if (k === 'F5'){ e.preventDefault(); V.toggleSlide(); }
    else if (k === 'i' || k === 'I'){ V.root.querySelector('[title^="사진 정보"]').click(); }
    else if (k === 'l' || k === 'L'){ V.root.querySelector('[title^="왼쪽 회전"]').click(); }
    else if (k === 'r' || k === 'R'){ V.root.querySelector('[title^="오른쪽 회전"]').click(); }
    else if (k === 'h' || k === 'H'){ V.root.querySelector('[title^="좌우 반전"]').click(); }
    else if (k === 'e' || k === 'E'){ const cur = V.list[V.i]; closeViewer(); openEditor(cur); }
    else if (c && (k === 'c' || k === 'C')){ copyItem(V.list[V.i]); }
    else if (k === 'Delete'){ V.root.querySelector('[title^="삭제"]').click(); }
    return;
  }
  if (c && e.shiftKey && (k === 'o' || k === 'O')){ e.preventDefault(); openFolder(); }
  else if (c && (k === 'o' || k === 'O')){ e.preventDefault(); openFiles(); }
  else if (c && (k === 'a' || k === 'A')){ e.preventDefault(); shown.forEach(x => selected.add(x.id)); updateSel(); }
  else if (c && (k === 'c' || k === 'C')){ e.preventDefault(); copySel(); }
  else if (c && (k === 'p' || k === 'P')){ e.preventDefault(); printSel(); }
  else if (c && (k === 'l' || k === 'L')){ e.preventDefault(); quickRotate(-90); }
  else if (c && (k === 'r' || k === 'R')){ e.preventDefault(); quickRotate(90); }
  else if (k === 'Enter'){ openViewer(); }
  else if (k === 'F5'){ e.preventDefault(); openViewer(null, true); }
  else if (k === 'e' || k === 'E'){ openEditor(); }
  else if (k === 'F2'){ e.preventDefault(); renameSel(); }
  else if (k === 'F1'){ e.preventDefault(); help(); }
  else if (k === 'Delete'){ deleteSel(); }
  else if (['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(k)){
    e.preventDefault(); if (!shown.length) return;
    const cols = Math.max(1, Math.floor($('#grid').clientWidth / (S.th + 10)));
    let i = shown.findIndex(x => x.id === focusId); const d = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[k];
    i = Math.max(0, Math.min(shown.length - 1, i < 0 ? 0 : i + d));
    focusId = shown[i].id; if (!e.shiftKey) selected.clear(); selected.add(focusId); lastSel = focusId; updateSel(); renderInfo();
    $('#grid').querySelector(`.thumb[data-id="${focusId}"]`)?.scrollIntoView({block:'nearest'});
  }
});
document.addEventListener('fullscreenchange', () => { if (V && V.fitted) setTimeout(() => V && V.fit(), 100); });

renderTree(); renderGrid(); renderInfo();
window.MoaSee = {addFiles, openViewer, openEditor, get all(){ return all; }, selectTool:k=>selectTool(k), get E(){ return E; }, batchDialog, gifDialog, combineDialog, sel:(ids)=>{ selected = new Set(ids); updateSel(); }};
})();
