<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%237c8cff%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Arial%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EH%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANAI Code - HANAI Tools 코드 편집기</title>
<link rel="stylesheet" href="lib/moa.css">
<style>
/* HANAI Code */
:root, [data-theme="dark"], [data-theme="pink"], [data-theme="green"]{
  --s-kw:#c586c0; --s-ty:#4ec9b0; --s-cn:#569cd6; --s-bi:#4fc1ff; --s-str:#ce9178; --s-num:#b5cea8; --s-com:#6a9955;
  --s-fn:#dcdcaa; --s-op:#c8cbd8; --s-meta:#d7ba7d; --s-var:#9cdcfe; --s-tag:#569cd6; --s-attr:#9cdcfe; --s-head:#4fc1ff;
  --s-quote:#8fbf7f; --s-strong:#e7eaf5; --s-em:#e7eaf5; --s-del:#8d94b3; --s-link:#3fa9ff; --s-code:#ce9178;
  --s-err:#ff6b6b; --s-warn:#e8c25a; --s-add:#7fd18b; --s-rem:#f48771;
  --s-c0:#e7eaf5; --s-c1:#4fc1ff; --s-c2:#dcdcaa; --s-c3:#c586c0; --s-c4:#7fd18b; --s-c5:#f48771;
  --edbg:#0f121b; --gutbg:#0f121b; --sel:rgba(63,193,201,.32); --cl:rgba(255,255,255,.045); --smbg:rgba(255,198,92,.28); --smc:rgba(255,150,40,.55);
  --ocbg:rgba(124,140,255,.25); --brbg:rgba(63,193,201,.28); --wsdot:rgba(141,148,179,.45); --mmview:rgba(160,170,210,.16); --caret:#e7eaf5;
}
[data-theme="pink"]{ --edbg:#1a1019; --gutbg:#1a1019; --sel:rgba(255,126,182,.3); --s-kw:#ff8fc8; }
[data-theme="green"]{ --edbg:#0c1612; --gutbg:#0c1612; --sel:rgba(79,220,143,.28); --s-kw:#b6e35a; }
[data-theme="light"], [data-theme="silver"]{
  --s-kw:#af00db; --s-ty:#267f99; --s-cn:#0000ff; --s-bi:#0070c1; --s-str:#a31515; --s-num:#098658; --s-com:#008000;
  --s-fn:#795e26; --s-op:#444b5e; --s-meta:#9a6e00; --s-var:#001080; --s-tag:#800000; --s-attr:#e50000; --s-head:#0451a5;
  --s-quote:#2f7d32; --s-strong:#1d2233; --s-em:#1d2233; --s-del:#7b839c; --s-link:#0066cc; --s-code:#a31515;
  --s-err:#cd3131; --s-warn:#b07a00; --s-add:#098658; --s-rem:#a1260d;
  --s-c0:#1d2233; --s-c1:#0451a5; --s-c2:#795e26; --s-c3:#af00db; --s-c4:#098658; --s-c5:#a1260d;
  --edbg:#ffffff; --gutbg:#f7f8fb; --sel:rgba(31,143,224,.25); --cl:rgba(0,0,0,.04); --smbg:rgba(255,190,60,.4); --smc:rgba(255,140,0,.6);
  --ocbg:rgba(106,92,255,.18); --brbg:rgba(31,143,224,.22); --wsdot:rgba(100,110,140,.45); --mmview:rgba(40,60,120,.12); --caret:#1d2233;
}
[data-theme="silver"]{ --edbg:#f7f8fa; --gutbg:#eceef2; }

body{overflow:hidden}
.menubar{display:flex;gap:1px;padding:2px 6px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.menubar button{border:0;background:none;padding:3px 10px;border-radius:5px;color:var(--text);font-size:12.5px;white-space:nowrap}
.menubar button:hover,.menubar button.open{background:var(--hover)}
.moa-toolbar .tb{min-width:50px}
.main{flex:1;display:flex;min-height:0}
.side{width:250px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0}
.side.hidden{display:none}
.side .tabs .tab{padding:6px 10px;font-size:12px}
.side .spane{flex:1;overflow:auto;min-height:0;display:none}
.side .spane.on{display:flex;flex-direction:column}
.sidehead{display:flex;align-items:center;gap:4px;padding:6px 8px;color:var(--dim);font-size:11.5px;border-bottom:1px solid var(--line)}
.sidehead b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sidehead .ibtn{width:24px;height:24px}
.sidehead .ibtn svg{width:15px;height:15px}
.resizer{width:4px;cursor:col-resize;flex:none;margin-left:-2px;margin-right:-2px;z-index:5}
.resizer:hover,.resizer.drag{background:var(--accent)}
.tree{flex:1;overflow:auto;padding:4px 0;font-size:12.5px}
.tn{display:flex;align-items:center;gap:4px;padding:2px 6px;cursor:pointer;white-space:nowrap;border-radius:4px;margin:0 4px;user-select:none}
.tn:hover{background:var(--hover)}
.tn.cur{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.tn .tw{width:12px;text-align:center;color:var(--dim);font-size:9px;flex:none}
.tn .fic{width:16px;height:14px;border-radius:3px;font-size:7.5px;font-weight:800;display:inline-grid;place-items:center;color:#fff;flex:none;letter-spacing:-.4px}
.tn .nm{overflow:hidden;text-overflow:ellipsis}
.tn.dirty .nm::after{content:" ●";color:var(--warn)}
.sideempty{padding:14px;color:var(--dim);font-size:12px;line-height:1.7}
.sideempty .btn{margin-top:8px}
.outline .tn{padding-left:calc(8px + var(--d,0) * 12px)}
.outline .k{font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 3px;flex:none}
.sfind{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.sfind input[type=text]{width:100%}
.sfind .row{flex-wrap:wrap}
.sres{flex:1;overflow:auto;font-size:12px;padding:4px 0}
.sres .f{padding:4px 8px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.sres .f:hover{background:var(--hover)}
.sres .f .c{margin-left:auto;color:var(--dim);font-weight:400;font-size:11px}
.sres .r{padding:2px 8px 2px 22px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.sres .r:hover{background:var(--hover)}
.sres .r .ln{color:var(--dim);margin-right:6px}
.sres .r mark{background:var(--smbg);color:inherit;border-radius:2px}
.work{flex:1;display:flex;flex-direction:column;min-width:0}
.tabbar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;overflow-y:hidden;min-height:33px}
.tabbar::-webkit-scrollbar{height:4px}
.ftab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:12.5px;color:var(--dim);max-width:240px;position:relative;user-select:none}
.ftab:hover{background:var(--hover)}
.ftab.on{background:var(--edbg);color:var(--text)}
.ftab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.ftab.on2{color:var(--text)}
.ftab.on2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent2)}
.ftab .nm{overflow:hidden;text-overflow:ellipsis}
.ftab .x{width:20px;height:20px;border-radius:4px;border:0;background:none;color:var(--dim);display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
.ftab .x:hover{background:var(--panel2);color:var(--text)}
.ftab.dirty .x::before{content:"●";font-size:11px;color:var(--text)}
.ftab.dirty .x span{display:none}
.ftab.dirty .x:hover::before{content:none}
.ftab.dirty .x:hover span{display:inline}
.ftab.ro .nm::after{content:" (읽기 전용)";color:var(--dim);font-size:11px}
.ftab.dragover{box-shadow:inset 3px 0 0 var(--accent)}
.tabplus{border:0;background:none;color:var(--dim);padding:0 10px;font-size:18px}
.tabplus:hover{color:var(--text);background:var(--hover)}
.panes{flex:1;display:flex;min-height:0;position:relative}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--edbg)}
.pane.hidden{display:none}
.pane + .pane{border-left:1px solid var(--line)}
.pane.focus2{box-shadow:inset 0 2px 0 var(--accent2)}
.pane .host{flex:1;position:relative;min-height:0}
.pane .crumb{flex:none;padding:3px 12px;font-size:11.5px;color:var(--dim);background:var(--edbg);border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:var(--panel)}
.preview.hidden{display:none}
.preview .phead{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
.preview .phead b{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview iframe{flex:1;border:0;width:100%;background:#fff}
.welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--dim);text-align:center;padding:20px}
.welcome h2{margin:0;color:var(--text);font-size:22px}
.welcome .row{flex-wrap:wrap;justify-content:center}
.welcome .recent{min-width:300px;max-width:520px;text-align:left}
.welcome .recent div{padding:4px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px}
.welcome .recent div:hover{background:var(--hover)}
.welcome .recent span{color:var(--dim);margin-left:auto;font-size:11px}
.welcome .keys{font-size:12px;line-height:2}

/* 편집기 */
.ed{position:absolute;inset:0;display:flex;--mono:var(--ff);font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);background:var(--edbg)}
.gut{flex:none;position:relative;overflow:hidden;background:var(--gutbg);color:var(--dim);user-select:none;cursor:pointer;border-right:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.ed.nogut .gut{display:none}
.gin{position:absolute;inset:0}
.gn{position:absolute;right:0;left:0;padding-right:10px;padding-left:14px;text-align:right;font-variant-numeric:tabular-nums;opacity:.65;height:var(--lh)}
.gn.cur{opacity:1;color:var(--text)}
.gn.bm::before{content:"";position:absolute;left:4px;top:calc(var(--lh)/2 - 4px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.edm{flex:1;position:relative;min-width:0;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cl{position:absolute;left:0;right:0;background:var(--cl);display:block}
.ed.nocl .cl{display:none}
.ed.plain .layer{display:none}
.lines{position:absolute;white-space:pre;tab-size:var(--tab);-moz-tab-size:var(--tab);color:var(--text);font-variant-ligatures:none}
.ed.wrap .lines{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.ln{min-height:var(--lh)}
.meas{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;tab-size:var(--tab);-moz-tab-size:var(--tab);font-variant-ligatures:none;overflow-wrap:break-word;word-break:normal}
.ta{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;outline:none;resize:none;padding:2px 30px 2px 8px;background:transparent;color:transparent;caret-color:var(--caret);font:inherit;line-height:var(--lh);white-space:pre;tab-size:var(--tab);-moz-tab-size:var(--tab);font-variant-ligatures:none;overflow:auto;box-sizing:border-box;z-index:1}
.ed.wrap .ta{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.ta::selection{background:var(--sel);color:transparent}
.ed.plain .ta{color:var(--text)}
.ed.plain .ta::selection{color:var(--text)}
.ed.multi .ta{caret-color:var(--caret)}
.ta::-webkit-scrollbar{width:12px;height:12px}
.ta[readonly]{caret-color:var(--dim)}
.mini{width:84px;flex:none;cursor:pointer;background:var(--edbg);border-left:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.ed.nomini .mini,.ed.plain .mini{display:none}
.t-kw{color:var(--s-kw)}.t-ty{color:var(--s-ty)}.t-cn{color:var(--s-cn)}.t-bi{color:var(--s-bi)}.t-str{color:var(--s-str)}.t-num{color:var(--s-num)}
.t-com{color:var(--s-com)}.t-fn{color:var(--s-fn)}.t-op{color:var(--s-op)}.t-meta{color:var(--s-meta)}.t-var{color:var(--s-var)}
.t-tag{color:var(--s-tag)}.t-attr{color:var(--s-attr)}.t-head{color:var(--s-head)}.t-quote{color:var(--s-quote)}
.t-strong{color:var(--s-strong);text-shadow:0 0 .6px currentColor}.t-em{color:var(--s-em);text-decoration:underline dotted color-mix(in srgb,var(--s-em) 50%,transparent)}.t-del{color:var(--s-del);text-decoration:line-through}
.t-link{color:var(--s-link);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--s-link) 40%,transparent)}.t-code{color:var(--s-code)}
.t-err{color:var(--s-err)}.t-warn{color:var(--s-warn)}.t-add{color:var(--s-add)}.t-rem{color:var(--s-rem)}
.t-c0{color:var(--s-c0)}.t-c1{color:var(--s-c1)}.t-c2{color:var(--s-c2)}.t-c3{color:var(--s-c3)}.t-c4{color:var(--s-c4)}.t-c5{color:var(--s-c5)}
.lines .hm{background:var(--smbg);border-radius:2px}
.lines .hmc{background:var(--smc);outline:1px solid var(--warn)}
.lines .oc{background:var(--ocbg);border-radius:2px}
.lines .br{background:var(--brbg);outline:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.lines .brx{background:color-mix(in srgb,var(--danger) 35%,transparent)}
.lines .ms{background:var(--sel)}
.lines .mc{display:inline-block;width:0;height:var(--lh);vertical-align:top;box-shadow:0 0 0 1px var(--caret);animation:mcblink 1.06s steps(1) infinite}
@keyframes mcblink{50%{box-shadow:none}}
.lines .ws{background:radial-gradient(circle at center,var(--wsdot) 0 1.2px,transparent 1.6px)}
.lines .wt{position:relative}
.lines .wt::before{content:"→";position:absolute;left:1px;top:0;color:var(--wsdot)}
.ac{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);min-width:160px;max-width:360px;max-height:230px;overflow:auto;font-size:12.5px;padding:3px;font-family:var(--ff)}
.aci{padding:2px 8px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aci b{color:var(--accent)}
.aci.on{background:color-mix(in srgb,var(--accent) 25%,transparent)}

/* 찾기 막대 */
.findbar{position:absolute;top:4px;right:100px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column;gap:4px;width:min(470px,calc(100% - 12px))}
.ed.nomini ~ .findbar{right:20px}
.findbar .fr{display:flex;align-items:center;gap:3px}
.findbar input{flex:1;min-width:0;font-family:var(--ff);font-size:12.5px;padding:4px 6px}
.findbar input.bad{border-color:var(--danger)}
.findbar .opt{border:1px solid transparent;background:none;border-radius:5px;font-size:11.5px;padding:2px 5px;color:var(--dim);min-width:24px;font-family:Consolas,monospace}
.findbar .opt.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.findbar .cnt{font-size:11px;color:var(--dim);min-width:62px;text-align:center;white-space:nowrap}
.findbar .ibtn{width:24px;height:24px}
.findbar .ibtn svg{width:15px;height:15px}
.findbar .btn.sm{padding:2px 7px}
.findbar .tog{width:18px;border:0;background:none;color:var(--dim);padding:0;font-size:11px;align-self:stretch}

/* 상태 막대 */
.moa-status .si{cursor:pointer;padding:0 4px;border-radius:4px}
.moa-status .si:hover{background:var(--hover);color:var(--text)}
.moa-status .warn{color:var(--warn)}

/* 팔레트 */
.pal-bg{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.2)}
.pal{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:1101;display:flex;flex-direction:column;max-height:70vh}
.pal input{margin:8px;font-size:14px;padding:7px 10px}
.pal .list{overflow:auto;padding:0 6px 6px}
.pal .it{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.pal .it.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.pal .it .d{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .it .k{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
.pal .it b{color:var(--accent)}
.pal .empty{padding:12px;color:var(--dim)}

/* 휴대폰 키 막대 */
.mkeys{display:flex;gap:3px;padding:4px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;flex:none}
.mkeys button{flex:none;min-width:38px;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;font-family:Consolas,monospace;font-size:14px;color:var(--text);padding:0 6px}
.mkeys button:active{background:var(--accent);color:var(--accentText)}

/* Diff */
.diffwrap{display:flex;flex-direction:column;gap:8px;height:min(76vh,900px)}
.diffbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.diffbar select{max-width:240px}
.diffview{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--edbg)}
.dt{border-collapse:collapse;width:100%;font-family:var(--ff, Consolas, monospace);font-size:12.5px;table-layout:fixed}
.dt td{padding:0 6px;white-space:pre-wrap;word-break:break-all;vertical-align:top;line-height:1.5;tab-size:4}
.dt td.n{width:48px;color:var(--dim);text-align:right;user-select:none;border-right:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt tr.del td.l, .dt tr.chg td.l{background:color-mix(in srgb,var(--danger) 16%,transparent)}
.dt tr.add td.r, .dt tr.chg td.r{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.dt tr.del td.r, .dt tr.add td.l{background:repeating-linear-gradient(-45deg,transparent 0 5px,color-mix(in srgb,var(--line) 35%,transparent) 5px 6px)}
.dt ins{background:color-mix(in srgb,var(--ok) 40%,transparent);text-decoration:none;border-radius:2px}
.dt del{background:color-mix(in srgb,var(--danger) 40%,transparent);text-decoration:none;border-radius:2px}
.dt tr.fold td{text-align:center;color:var(--dim);background:var(--panel2);cursor:pointer;font-size:11.5px;padding:2px}
.dt tr.fold:hover td{color:var(--accent)}
.dt tr.cur td{outline:1px solid var(--accent);outline-offset:-1px}
.dt td.m{width:14px;padding:0;text-align:center;color:var(--dim);user-select:none}
.dstat .a{color:var(--ok)} .dstat .d{color:var(--danger)}

/* 표 보기 / 기타 */
.csvwrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.csvwrap table td,.csvwrap table th{max-width:320px}
.hashout{font-family:Consolas,monospace;font-size:12.5px;word-break:break-all}
.hashout td{padding:4px 6px;border-bottom:1px solid var(--line)}
.setgrid{display:grid;grid-template-columns:160px 1fr;gap:7px 10px;align-items:center;font-size:13px}
.setgrid>span{color:var(--dim)}
.setgrid .chks{display:flex;flex-wrap:wrap;gap:6px 14px}
.langlist{max-height:60vh;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
.langlist button{text-align:left;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.langlist button.on{border-color:var(--accent);color:var(--accent)}
.langlist button small{display:block;color:var(--dim);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help h3{margin:14px 0 6px;font-size:14px}
.help p,.help li{color:var(--dim);line-height:1.7;font-size:12.5px}
@media (max-width:760px){
  .side{position:absolute;z-index:50;top:0;bottom:0;left:0;box-shadow:var(--shadow)}
  .main{position:relative}
  .moa-toolbar .tb span{display:none}
  .moa-toolbar .tb{min-width:40px}
  .mini{display:none}
  .findbar{right:6px}
  .moa-title .sub{display:none}
  .preview:not(.hidden) ~ .x{display:none}

/* lang.js */
/* HANAI Code - 언어별 문법 강조(토크나이저) */
(function(){
'use strict';
const HC = window.HC = window.HC || {};
const L = HC.langs = {};
const S = s => new Set(s.split(/\s+/).filter(Boolean));

const NUM = /(?:0[xX][\da-fA-F_]+n?|0[bB][01_]+|0[oO][0-7_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d+)?)[a-zA-Z]*/y;

const MAXLEN = 6000;

/* 따옴표 문자열 끝 찾기 */
function scanStr(line, i, q, noEsc){
  const n = line.length;
  if (q.length === 1){
    while (i < n){
      const c = line[i];
      if (c === '\\' && !noEsc){ i += 2; continue; }
      if (c === q) return {end:i+1, closed:true};
      i++;
    }
    return {end:n, closed:false};
  }
  while (i < n){
    if (line[i] === '\\' && !noEsc){ i += 2; continue; }
    if (line.startsWith(q, i)) return {end:i+q.length, closed:true};
    i++;
  }
  return {end:n, closed:false};
}

/* 일반(C 계열 등) 토크나이저 생성기 */
function generic(o){
  const kw = o.kw || new Set(), ty = o.ty, cn = o.cn, bi = o.bi;
  const idRe = o.noDollar ? ID_NODOLLAR : ID;
  const defKw = o.defKw || S('function def class fn func fun struct interface enum trait impl type sub proc procedure macro');
  return function(line, st){
    const t = []; let i = 0; const n = line.length;
    if (n > MAXLEN) return [t, st];
    if (st){
      if (st.t === 'bc'){
        const j = line.indexOf(st.e);
        if (j < 0){ if (n) t.push(0, n, 'com'); return [t, st]; }
        t.push(0, j + st.e.length, 'com'); i = j + st.e.length;
      } else if (st.t === 's'){
        const r = scanStr(line, 0, st.q, o.noEsc);

        if (!r.closed) return [t, st];
        i = r.end;
      }
    }
    st = null;
    if (o.lineCom && o.lineCom.test(line)){ t.push(0, n, 'com'); return [t, null]; }

    let lastKw = null, prevSig = '';
    outer: while (i < n){
      const c = line[i];
      if (c === ' ' || c === '\t'){ i++; continue; }
      if (o.bc) for (const [s, e] of o.bc) if (line.startsWith(s, i)){
        const j = line.indexOf(e, i + s.length);
        if (j < 0){ t.push(i, n, 'com'); return [t, {t:'bc', e}]; }
        t.push(i, j + e.length, 'com'); i = j + e.length; continue outer;
      }
      if (o.lc) for (const p of o.lc) if (line.startsWith(p, i)){ t.push(i, n, 'com'); return [t, null]; }

      }
      if ((c >= '0' && c <= '9') || (c === '.' && line[i+1] >= '0' && line[i+1] <= '9')){

      }

      if (o.vars && c === '$'){
        const re = /\$(?:\{[^}]*\}|\(|[A-Za-z_]\w*|[@#?$!*0-9-])/y; re.lastIndex = i; const m = re.exec(line);

      }

      if (m){
        const w = m[0], e = i + w.length, k = o.ci ? w.toLowerCase() : w;
        if (o.strPrefix && o.strPrefix.test(w) && o.str && o.str.some(q => line.startsWith(q, e))){

            const r = scanStr(line, e + q.length, q, o.noEsc || /r/i.test(w));
            t.push(i, r.end, 'str');
            if (!r.closed){ if (o.ml && o.ml.includes(q)) return [t, {t:'s', q}]; return [t, null]; }
            i = r.end; continue outer;
          }
        }
        let cls = null;
        if (lastKw && defKw.has(lastKw)) cls = (lastKw === 'class' || lastKw === 'struct' || lastKw === 'interface' || lastKw === 'enum' || lastKw === 'trait' || lastKw === 'type') ? 'ty' : 'fn';

        i = e; prevSig = 'a'; continue;
      }
      if (OPS.includes(c)){
        let j = i + 1; while (j < n && j - i < 3 && OPS.includes(line[j]) && !(o.pct && line[j] === '%')) j++;

      }
      prevSig = c; if (c !== ' ') lastKw = (c === '*' ? lastKw : null);
      i++;
    }
    return [t, st];
  };
}

/* 탭 막대 */

    const d = el('div', {class:'ftab' + (on ? ' on' : '') + (inOther ? ' on2' : '') + (t.dirty ? ' dirty' : '') + (t.readOnly ? ' ro' : ''), title: (t.handle ? '' : t.untitled ? '새 문서 · ' : '') + t.path + (t.enc ? '  ·  ' + t.enc : ''), draggable:'true'},

A.renderTabs = renderTabs;

/* 변경 감지 */
let dirtyT;

  clearTimeout(t._dt); t._dt = setTimeout(() => { const d = t.ed.getText() !== t.saved; if (d !== t.dirty){ t.dirty = d; renderTabs(); updateTitle(); } }, 350);

/* ---------- 열기 ---------- */
async function ensurePerm(h, write){
  if (!h || !h.queryPermission) return true;
  const o = {mode: write ? 'readwrite' : 'read'};
  try { if (await h.queryPermission(o) === 'granted') return true; return (await h.requestPermission(o)) === 'granted'; } catch(e){ return false; }
}
A.ensurePerm = ensurePerm;
async function findTabByHandle(h){ for (const t of tabs) if (t.handle && t.handle.isSameEntry){ try { if (await t.handle.isSameEntry(h)) return t; } catch(e){} } return null; }
A.openFiles = async function(){
  if (window.showOpenFilePicker){
    try { const hs = await showOpenFilePicker({multiple:true}); for (const h of hs) await A.openHandle(h); }
    catch(e){ if (e.name !== 'AbortError') Moa.toast('열기 실패: ' + e.message); }
    return;
  }
  const fs = await Moa.pickFiles({multiple:true}); for (const f of fs) await A.openFile(f);
};
A.openHandle = async function(h, path, opt){
  const ex = await findTabByHandle(h); if (ex){ activate(ex); return ex; }
  if (!await ensurePerm(h, false)){ Moa.toast('파일을 읽을 권한이 없습니다'); return null; }
  let f; try { f = await h.getFile(); } catch(e){ Moa.toast('파일을 읽을 수 없습니다: ' + e.message); return null; }
  return A.openFile(f, h, path, opt);
};
A.openFile = async function(f, handle, path, opt){
  opt = opt || {};
  path = path || f.relPath || f.name;
  if (!handle){ const ex = tabs.find(t => !t.handle && !t.untitled && t.path === path); if (ex){ activate(ex); return ex; } }
  if (f.size > 120 * MB){ Moa.alert(`파일이 너무 큽니다 (${Moa.fmtBytes(f.size)}).\n브라우저 편집기에서는 120MB까지 열 수 있습니다.`); return null; }
  if (f.size > 25 * MB && !await Moa.confirm(`큰 파일입니다 (${Moa.fmtBytes(f.size)}). 여는 데 시간이 걸리고 문법 강조가 꺼집니다.\n열까요?`)) return null;
  const bytes = new Uint8Array(await f.arrayBuffer());
  if (!opt.text && isBinary(bytes)){
    const c = await Moa.modal({title:'이진 파일', body:`"${f.name}"은(는) 텍스트 파일이 아닌 것 같습니다.`, buttons:[{label:'취소', value:null},{label:'텍스트로 열기', value:'text'},{label:'HEX로 보기', primary:true, value:'hex'}]});
    if (!c) return null;
    if (c === 'hex') return A.openHex(f.name, bytes);
  }
  const d = A.decodeBytes(bytes, opt.enc);
  const n = normEol(d.text);
  const c = cur();
  const t = newTab({name:f.name, text:n.text, handle, path, enc:d.enc, eol:n.eol, raw: bytes.length < 30 * MB ? bytes : null, mtime:f.lastModified, saved:n.text});

  activate(t);
  if (n.mixed) Moa.toast('줄 끝 문자(CRLF/LF)가 섞여 있어 ' + n.eol + '로 맞춥니다');
  if (t.ed.plain) Moa.toast('큰 파일이라 문법 강조와 미니맵을 껐습니다');

  return t;
};
A.openHex = function(name, bytes){
  const lim = Math.min(bytes.length, 2 * MB); const rows = [];
  const hx = b => (b < 16 ? '0' : '') + b.toString(16).toUpperCase();
  for (let o = 0; o < lim; o += 16){
    let h = '', a = '';
    for (let k = 0; k < 16; k++){ if (o + k < lim){ const b = bytes[o + k]; h += hx(b) + (k === 7 ? '  ' : ' '); a += b >= 32 && b < 127 ? String.fromCharCode(b) : '.'; } else h += k === 7 ? '    ' : '   '; }
    rows.push(o.toString(16).toUpperCase().padStart(8, '0') + '  ' + h + ' |' + a + '|');
  }
  if (bytes.length > lim) rows.push('', `… 처음 ${Moa.fmtBytes(lim)}만 표시했습니다 (전체 ${Moa.fmtBytes(bytes.length)})`);
  const t = newTab({name:name + ' (HEX)', text:rows.join('\n'), lang:'hex', readOnly:true, hex:true});
  activate(t); return t;
};
A.reloadTab = async function(t, enc){
  t = t || cur(); if (!t) return;
  if (t.dirty && !await Moa.confirm('저장하지 않은 변경 내용이 사라집니다. 다시 읽을까요?')) return;
  let bytes = null;
  if (t.handle){ if (!await ensurePerm(t.handle, false)) return; const f = await t.handle.getFile(); bytes = new Uint8Array(await f.arrayBuffer()); t.mtime = f.lastModified; }

  if (!bytes){ if (enc){ t.enc = enc; t.dirty = true; renderTabs(); updateStatus(); Moa.toast('저장할 때 ' + enc + '(으)로 저장합니다'); } else Moa.toast('원본 파일 정보가 없어 다시 읽을 수 없습니다'); return; }

/* ---------- 저장 ---------- */
const EXT_FOR = {javascript:'js', typescript:'ts', json:'json', html:'html', xml:'xml', css:'css', markdown:'md', python:'py', java:'java', c:'c', cpp:'cpp', csharp:'cs', go:'go', rust:'rs', php:'php', ruby:'rb', sql:'sql', shell:'sh', batch:'bat', powershell:'ps1', yaml:'yml', ini:'ini', csv:'csv', lua:'lua', kotlin:'kt', swift:'swift', dart:'dart', diff:'diff', log:'log'};
function suggestName(t){
  if (!t.untitled) return t.name.replace(/ \(HEX\)$/, '.txt');
  const first = (t.ed.getText().split('\n').find(l => l.trim()) || '').replace(/^[#>\-*\s/]+/, '').replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 40);
  return (first || t.name) + '.' + (EXT_FOR[t.lang] || 'txt');
}
A.save = async function(t, as, quiet){

  if (S.finalNewline && text && !text.endsWith('\n')){ t.ed._noFocus = true; t.ed.replaceRange(text.length, text.length, '\n'); t.ed._noFocus = false; text = t.ed.getText(); }
  const out = t.eol === 'LF' ? text : text.replace(/\n/g, EOLS[t.eol] || '\n');
  const {bytes, bad} = A.encodeText(out, t.enc);
  if (bad && !quiet){
    const r = await Moa.modal({title:'인코딩 경고', body:`${bad}개 글자는 ${t.enc}(으)로 저장할 수 없어 "?"로 바뀝니다.`, buttons:[{label:'취소', value:null},{label:'그대로 저장', value:'keep'},{label:'UTF-8로 저장', primary:true, value:'utf8'}]});
    if (!r) return false;
    if (r === 'utf8'){ t.enc = 'UTF-8'; return A.save(t, as); }

A.symbols = function(t){
  if (!t) return [];
  const ed = t.ed, lang = t.lang, out = [];
  if (lang === 'markdown'){ for (const h of HC.mdHeadings(ed.getText())) out.push({text:h.text, kind:'H' + h.level, line:h.line, depth:h.level - 1}); return out; }
  if (lang === 'html' || lang === 'xml'){
    ed.lines.forEach((l, i) => { const re = /<(h[1-6])[^>]*>(.*?)<\/\1>|<(\w+)[^>]*\sid=["']([^"']+)["']/gi; let m; while ((m = re.exec(l))){ if (m[1]) out.push({text:m[2].replace(/<[^>]+>/g, ''), kind:m[1].toUpperCase(), line:i, depth:+m[1][1] - 1}); else out.push({text:'#' + m[4], kind:m[3], line:i, depth:0}); } });
    return out;
  }
  const rules = SYM[lang]; if (!rules) return out;
  const unit = ed.indent.spaces ? ed.indent.size : 1;
  const lines = ed.lines; let inBlock = false;
  for (let i = 0; i < lines.length && out.length < 5000; i++){
    const l = lines[i]; if (l.length > 400) continue;
    if (/^\s*(\/\/|#(?!include)|--|;|\*|\/\*)/.test(l) && lang !== 'css' && lang !== 'ini' && lang !== 'batch') continue;
    for (const [re, kind] of rules){
      const m = re.exec(l); if (!m) continue;
      if (lang === 'c' || lang === 'cpp'){ if (/^\s*(if|for|while|switch|return|else|do|sizeof|case)\b/.test(l) || /;\s*$/.test(l)) continue; }
      if (lang === 'yaml' && /^\s/.test(l)) continue;
      if (lang === 'css' && /^\s/.test(l) && !/^\s+[^:]+\{/.test(l)) continue;
      const ind = /^[ \t]*/.exec(l)[0]; const depth = ind.includes('\t') ? ind.length : Math.floor(ind.length / unit);
      const name = kind ? m[1].trim() : m[2]; const k = kind || m[1].toLowerCase();
      out.push({text:name, kind:k, line:i, depth:Math.min(depth, 8)});
      break;
    }
  }
  return out;
};

/* ================= 내보내기 · 인쇄 ================= */
function docHTML(t, forPrint){
  const text = t.ed.getText();
  if (t.lang === 'markdown') return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${Moa.esc(t.name.replace(/\.[^.]+$/, ''))}</title><style>${previewCSS(false)} body{margin:0 auto;padding:32px}${forPrint ? '@page{margin:16mm} body{padding:0;max-width:none} pre{white-space:pre-wrap}' : ''}</style></head><body>${HC.markdown(text)}</body></html>`;
  const lines = HC.highlightToHTML(text, t.lang).split('\n');
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${Moa.esc(t.name)}</title><style>${tokenCSS(false)} body{margin:0;padding:16px;font:12px/1.5 "D2Coding",Consolas,monospace;color:#1f2328} h1{font:bold 13px sans-serif;margin:0 0 10px} table{border-collapse:collapse;width:100%} td{vertical-align:top;white-space:pre-wrap;word-break:break-all;tab-size:${t.ed.indent.size}} td.n{color:#999;text-align:right;padding-right:10px;user-select:none;width:1%;white-space:nowrap;border-right:1px solid #ddd} td.c{padding-left:10px} @page{margin:14mm}</style></head><body><h1>${Moa.esc(t.path)}</h1><table>${lines.map((l, i) => `<tr><td class="n">${i + 1}</td><td class="c">${l || ' '}</td></tr>`).join('')}</table></body></html>`;
}
function printDoc(){
  const t = A.cur(); if (!t) return;
  const f = el('iframe', {style:{position:'fixed', right:'0', bottom:'0', width:'0', height:'0', border:'0'}});
  document.body.append(f);
  f.onload = () => { setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e){ Moa.toast('인쇄할 수 없습니다'); } setTimeout(() => f.remove(), 2000); }, 200); };
  f.srcdoc = docHTML(t, true);
}
function exportHTML(){
  const t = A.cur(); if (!t) return;
  Moa.saveAs(new Blob([docHTML(t, false)], {type:'text/html'}), t.name.replace(/\.[^.]+$/, '') + '.html');
}
